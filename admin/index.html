<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
<script type="text/javascript" src="../../socket.io/socket.io.js"></script>
<script type="text/javascript" src="../../js/translate.js"></script>
<script type="text/javascript" src="../../js/adapter-settings.js"></script>
<script type="text/javascript">
systemDictionary = {
    "adminPort": {"en": "Editor port", "ru": "Порт редактора", "de": "Editor-Port"},
    "presentationPort": {"en": "Presentation port", "ru": "Порт презентации", "de": "Präsentations-Port"},
    "bind": {"en": "IP address (0.0.0.0 = all)", "ru": "IP адрес (0.0.0.0 = все)", "de": "IP-Adresse"}
};
</script>
<style>
body{font-family:'Segoe UI',sans-serif;padding:20px}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.col{flex:1;min-width:200px}
input{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px}
.links{background:#eef4fb;border:1px solid #cfe0f4;border-radius:10px;padding:16px;margin-top:20px}
.links a{display:inline-block;margin:6px 16px 0 0;color:#0061a4;font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
/* Принудительное выравнивание Material Icons */
.material-icons{font-size:20px!important;line-height:1!important;vertical-align:middle!important;display:inline-block!important}
.m .material-icons.left{margin-right:8px;margin-top:-2px}
.m .dialog-config-buttons .btn:first-child{margin-left:8px}
</style></head><body>
<h3>Floor Plan Visualizer</h3>
<div class="row">
<div class="col"><input class="value" id="adminPort" type="number"></div>
<div class="col"><input class="value" id="presentationPort" type="number"></div>
<div class="col"><input class="value" id="bind" type="text"></div></div>
<div class="links"><strong>Открыть:</strong><br>
<a id="linkEditor" target="_blank" rel="noopener">Редактор</a>
<a id="linkPres" target="_blank" rel="noopener">Презентация</a></div>
<script>
function curIp(){var b=$('#bind').val();return(b&&b!=='0.0.0.0')?b:location.hostname;}
function updLinks(){
var e='http://'+curIp()+':'+($('#adminPort').val()||8083)+'/editor.html';
var p='http://'+curIp()+':'+($('#presentationPort').val()||8084)+'/';
$('#linkEditor').attr('href',e).text('Редактор — '+e);
$('#linkPres').attr('href',p).text('Презентация — '+p);}
function load(settings,onChange){
settings=settings||{};
$('#adminPort').val(settings.adminPort!=null?settings.adminPort:8083);
$('#presentationPort').val(settings.presentationPort!=null?settings.presentationPort:8084);
$('#bind').val(settings.bind||'0.0.0.0');
$('.value').on('change input',function(){onChange();updLinks();});
updLinks();
onChange(false);}
function save(callback){
callback({adminPort:parseInt($('#adminPort').val(),10)||8083,
presentationPort:parseInt($('#presentationPort').val(),10)||8084,
bind:$('#bind').val()||'0.0.0.0'});}
</script></body></html>
