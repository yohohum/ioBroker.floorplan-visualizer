<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Floor Plan Visualizer Settings</title>
    <link rel="stylesheet" type="text/css" href="../../css/adapter.css"/>
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>
</head>
<body>
    <div class="m adapter-container">
        <h4>Настройки портов Floor Plan Visualizer</h4>
        <div class="row">
            <div class="col s12 m4">
                <div class="input-field">
                    <input class="value" id="adminPort" type="number" min="1024" max="65535"/>
                    <label for="adminPort">Порт редактора</label>
                </div>
            </div>
            <div class="col s12 m4">
                <div class="input-field">
                    <input class="value" id="presentationPort" type="number" min="1024" max="65535"/>
                    <label for="presentationPort">Порт презентации</label>
                </div>
            </div>
            <div class="col s12 m4">
                <div class="input-field">
                    <input class="value" id="bind" type="text"/>
                    <label for="bind">IP адрес (0.0.0.0 = все)</label>
                </div>
            </div>
        </div>
        <div style="background:#e3f2fd; padding:15px; border-radius:8px; margin-top:20px;">
            <strong>Ссылки для использования:</strong><br>
            Редактор: <code>http://ВАШ_IP:ПОРТ_РЕДАКТОРА/editor.html</code><br>
            Презентация (все этажи): <code>http://ВАШ_IP:ПОРТ_ПРЕЗЕНТАЦИИ/</code><br>
            Презентация (конкретный этаж): <code>http://ВАШ_IP:ПОРТ_ПРЕЗЕНТАЦИИ/?floor=floor_1</code>
        </div>
    </div>
    <script>
        function load(settings, onChange) {
            if (!settings) return;
            $('#adminPort').val(settings.adminPort || 8083).on('change', () => onChange()).on('keyup', () => onChange());
            $('#presentationPort').val(settings.presentationPort || 8084).on('change', () => onChange()).on('keyup', () => onChange());
            $('#bind').val(settings.bind || '0.0.0.0').on('change', () => onChange()).on('keyup', () => onChange());
            if (typeof M !== 'undefined') M.updateTextFields();
            onChange(false);
        }
        function save(callback) {
            callback({
                adminPort: parseInt($('#adminPort').val(), 10) || 8083,
                presentationPort: parseInt($('#presentationPort').val(), 10) || 8084,
                bind: $('#bind').val() || '0.0.0.0'
            });
        }
    </script>
</body>
</html>
