<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Floor Plan Visualizer Settings</title>
    <link rel="stylesheet" type="text/css" href="../../css/adapter.css"/>
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>
    <style>
        .adapter-header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .tabs-content { padding: 20px 0; }
        .card-panel { margin-bottom: 15px; }
        .device-item { background: #f5f5f5; padding: 10px; border-radius: 4px; margin-bottom: 10px; border-left: 4px solid #0cbaba; }
        .btn-small { height: 36px; line-height: 36px; padding: 0 15px; font-size: 12px; }
        .color-input { width: 60px; height: 40px; padding: 0; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="m adapter-container">
        <div class="adapter-header">
            <h4 class="translate">Floor Plan Visualizer Settings</h4>
        </div>

        <ul class="tabs">
            <li class="tab col s3"><a href="#tab-general" class="active translate">Общие</a></li>
            <li class="tab col s3"><a href="#tab-styles" class="translate">Глобальные стили</a></li>
            <li class="tab col s3"><a href="#tab-structure" class="translate">Этажи и Слои</a></li>
        </ul>

        <div class="tabs-content">
            <!-- Общие -->
            <div id="tab-general" class="col s12">
                <div class="row">
                    <div class="col s12 m6">
                        <div class="input-field">
                            <input class="value" id="port" type="number" min="1024" max="65535"/>
                            <label for="port" class="translate">Web Server Port</label>
                        </div>
                    </div>
                    <div class="col s12 m6">
                        <div class="input-field">
                            <input class="value" id="bind" type="text"/>
                            <label for="bind" class="translate">Bind IP Address</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Глобальные стили -->
            <div id="tab-styles" class="col s12">
                <div class="row">
                    <div class="col s12 m4">
                        <div class="input-field">
                            <input class="value" id="iconSize" type="number"/>
                            <label for="iconSize">Размер иконок (px)</label>
                        </div>
                    </div>
                    <div class="col s12 m4">
                        <div class="input-field">
                            <input class="value" id="iconOpacity" type="number" step="0.1" min="0" max="1"/>
                            <label for="iconOpacity">Прозрачность иконок (0-1)</label>
                        </div>
                    </div>
                </div>
                <h6 class="translate">Цвета состояний</h6>
                <div class="row">
                    <div class="col s6 m3"><label>Свет ВКЛ</label><input type="color" class="value color-input" id="colorLightOn"></div>
                    <div class="col s6 m3"><label>Свет ВЫКЛ</label><input type="color" class="value color-input" id="colorLightOff"></div>
                    <div class="col s6 m3"><label>Розетка ВКЛ</label><input type="color" class="value color-input" id="colorSocketOn"></div>
                    <div class="col s6 m3"><label>Розетка ВЫКЛ</label><input type="color" class="value color-input" id="colorSocketOff"></div>
                    <div class="col s6 m3"><label>Датчик Норма</label><input type="color" class="value color-input" id="colorSensorNormal"></div>
                    <div class="col s6 m3"><label>Датчик Высокий</label><input type="color" class="value color-input" id="colorSensorHigh"></div>
                    <div class="col s6 m3"><label>Датчик Низкий</label><input type="color" class="value color-input" id="colorSensorLow"></div>
                    <div class="col s6 m3"><label>Безопасность Норма</label><input type="color" class="value color-input" id="colorSecurityNormal"></div>
                    <div class="col s6 m3"><label>Безопасность Тревога</label><input type="color" class="value color-input" id="colorSecurityTriggered"></div>
                </div>
                <h6 class="translate">Шрифт значений датчиков</h6>
                <div class="row">
                    <div class="col s12 m3"><input class="value" id="sensorFontFamily" type="text" placeholder="Arial, sans-serif"><label>Семейство шрифтов</label></div>
                    <div class="col s12 m3"><input class="value" id="sensorFontWeight" type="text" placeholder="bold"><label>Начертание</label></div>
                    <div class="col s12 m3"><input class="value" id="sensorFontSize" type="text" placeholder="12px"><label>Размер</label></div>
                    <div class="col s12 m3"><input type="color" class="value color-input" id="sensorFontColor" style="margin-top: 25px;"><label>Цвет</label></div>
                </div>
            </div>

            <!-- Этажи и Слои -->
            <div id="tab-structure" class="col s12">
                <div id="structure-container"></div>
                <button class="btn waves-effect waves-light" onclick="addFloor()" style="margin-top: 15px;">+ Добавить этаж</button>
            </div>
        </div>
    </div>

    <script>
        let currentConfig = {};

        function load(settings, onChange) {
            if (!settings) return;
            $('#port').val(settings.port || 8083).on('change', () => onChange()).on('keyup', () => onChange());
            $('#bind').val(settings.bind || '0.0.0.0').on('change', () => onChange()).on('keyup', () => onChange());
            
            // Загрузка конфигурации плана из отдельного состояния или из native (если там)
            socket.emit('getState', 'floorplan-visualizer.0.config', (err, state) => {
                if (state && state.val) {
                    currentConfig = JSON.parse(state.val);
                    renderStructure(onChange);
                } else {
                    currentConfig = { globalSettings: {}, floors: [] };
                    renderStructure(onChange);
                }
            });

            if (typeof M !== 'undefined') M.updateTextFields();
            onChange(false);
        }

        function save(callback) {
            const obj = {
                port: parseInt($('#port').val(), 10) || 8083,
                bind: $('#bind').val() || '0.0.0.0'
            };
            // Сохраняем конфигурацию плана в состояние
            socket.emit('setState', 'floorplan-visualizer.0.config', { val: JSON.stringify(currentConfig, null, 2), ack: false });
            callback(obj);
        }

        function renderStructure(onChange) {
            const container = $('#structure-container');
            container.empty();
            
            // Заполнение глобальных настроек
            const gs = currentConfig.globalSettings || {};
            $('#iconSize').val(gs.iconSize || 48).on('change', () => { currentConfig.globalSettings.iconSize = +this.value; onChange(); });
            $('#iconOpacity').val(gs.iconOpacity || 1.0).on('change', () => { currentConfig.globalSettings.iconOpacity = +this.value; onChange(); });
            
            const colors = gs.colors || {};
            $('#colorLightOn').val(colors.lightOn || '#f39c12').on('change', () => { currentConfig.globalSettings.colors.lightOn = this.value; onChange(); });
            $('#colorLightOff').val(colors.lightOff || '#7f8c8d').on('change', () => { currentConfig.globalSettings.colors.lightOff = this.value; onChange(); });
            $('#colorSocketOn').val(colors.socketOn || '#e67e22').on('change', () => { currentConfig.globalSettings.colors.socketOn = this.value; onChange(); });
            $('#colorSocketOff').val(colors.socketOff || '#7f8c8d').on('change', () => { currentConfig.globalSettings.colors.socketOff = this.value; onChange(); });
            $('#colorSensorNormal').val(colors.sensorNormal || '#3498db').on('change', () => { currentConfig.globalSettings.colors.sensorNormal = this.value; onChange(); });
            $('#colorSensorHigh').val(colors.sensorHigh || '#e74c3c').on('change', () => { currentConfig.globalSettings.colors.sensorHigh = this.value; onChange(); });
            $('#colorSensorLow').val(colors.sensorLow || '#2ecc71').on('change', () => { currentConfig.globalSettings.colors.sensorLow = this.value; onChange(); });
            $('#colorSecurityNormal').val(colors.securityNormal || '#2ecc71').on('change', () => { currentConfig.globalSettings.colors.securityNormal = this.value; onChange(); });
            $('#colorSecurityTriggered').val(colors.securityTriggered || '#e74c3c').on('change', () => { currentConfig.globalSettings.colors.securityTriggered = this.value; onChange(); });

            const font = gs.sensorFont || {};
            $('#sensorFontFamily').val(font.family || 'Arial, sans-serif').on('change', () => { currentConfig.globalSettings.sensorFont.family = this.value; onChange(); });
            $('#sensorFontWeight').val(font.weight || 'bold').on('change', () => { currentConfig.globalSettings.sensorFont.weight = this.value; onChange(); });
            $('#sensorFontSize').val(font.size || '12px').on('change', () => { currentConfig.globalSettings.sensorFont.size = this.value; onChange(); });
            $('#sensorFontColor').val(font.color || '#ffffff').on('change', () => { currentConfig.globalSettings.sensorFont.color = this.value; onChange(); });

            // Рендер этажей
            (currentConfig.floors || []).forEach((floor, fIdx) => {
                const floorHtml = `
                    <div class="card-panel">
                        <div class="row" style="margin-bottom:0; align-items:center;">
                            <div class="col s4">
                                <input type="text" value="${floor.name}" onchange="updateFloor(${fIdx}, 'name', this.value)" placeholder="Название этажа">
                            </div>
                            <div class="col s6">
                                <label style="font-size:12px;">Изображение плана:</label>
                                <input type="file" accept="image/*" onchange="handleImageUpload(this, ${fIdx})">
                                ${floor.image ? `<div style="font-size:11px; color:green; margin-top:5px;">Загружено</div>` : ''}
                            </div>
                            <div class="col s2 right-align">
                                <button class="btn red btn-small" onclick="removeFloor(${fIdx})">Удалить этаж</button>
                            </div>
                        </div>
                        <div style="margin-top:15px; padding-left:20px;">
                            <h6>Слои:</h6>
                            ${renderLayers(floor, fIdx, onChange)}
                            <button class="btn blue btn-small" onclick="addLayer(${fIdx})">+ Добавить слой</button>
                        </div>
                    </div>
                `;
                container.append(floorHtml);
            });
            if (typeof M !== 'undefined') M.updateTextFields();
        }

        function renderLayers(floor, fIdx, onChange) {
            return (floor.layers || []).map((layer, lIdx) => `
                <div class="card-panel" style="padding:10px; background:#eceff1;">
                    <div class="row" style="margin-bottom:0;">
                        <div class="col s3">
                            <input type="text" value="${layer.name}" onchange="updateLayer(${fIdx}, ${lIdx}, 'name', this.value)" placeholder="Название слоя">
                        </div>
                        <div class="col s3">
                            <select onchange="updateLayer(${fIdx}, ${lIdx}, 'type', this.value)" class="browser-default">
                                <option value="lighting" ${layer.type === 'lighting' ? 'selected' : ''}>Освещение</option>
                                <option value="socket" ${layer.type === 'socket' ? 'selected' : ''}>Розетки</option>
                                <option value="sensor" ${layer.type === 'sensor' ? 'selected' : ''}>Датчики</option>
                                <option value="security" ${layer.type === 'security' ? 'selected' : ''}>Безопасность</option>
                                <option value="custom" ${layer.type === 'custom' ? 'selected' : ''">Свой тип</option>
                            </select>
                        </div>
                        <div class="col s4 right-align">
                            <button class="btn green btn-small" onclick="addDevice(${fIdx}, ${lIdx})">+ Устройство</button>
                            <button class="btn red btn-small" onclick="removeLayer(${fIdx}, ${lIdx})">Удалить</button>
                        </div>
                    </div>
                    <div style="margin-top:10px;">
                        ${renderDevices(layer, fIdx, lIdx, onChange)}
                   .map(d => `
                        <div class="device-item">
                            <div class="row" style="margin-bottom:5px;">
                                <div class="col s12">
                                    <strong>Устройство:</strong> 
                                    <button class="btn red btn-small right" onclick="removeDevice(${fIdx}, ${lIdx}, '${d.id}')">Удалить</button>
                               3. `www/index.html`
*(Полностью переработан для поддержки динамических этажей/слоев, глобальных стилей, иконок `icons-mfd-png` и многозначных датчиков)*

<body>
    <div class="status disconnected" id="connStatus">Отключено</div>
    <div class="wrapper">
        <div class="tabs" id="floorTabs"></div>
        <div class="tabs" id="layerTabs"></div>
        <div class="plan-container" id="planContainer">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script>
        let config = null, socket = null, currentFloorId = null, currentLayerId = null, deviceStates = {};

        function connect() {
            socket = io();
            socket.on('connect', () => { 
                document.getElementById('connStatus').textContent = 'Подключено'; 
                document.getElementById('connStatus').className = 'status connected'; 
                subscribe(); 
            });
            socket.on('disconnect', () => { 
                document.getElementById('connStatus').textContent = 'Отключено'; 
                document.getElementById('connStatus').className = 'status disconnected'; 
            });
            socket.on('stateChange', (id, state) => { 
                deviceStates[id] = state.val; 
                updateAllVisualsForState(id, state.val); 
            });
            socket.on('configChanged', (newConfig) => { 
                config = newConfig; 
                renderStructure(); 
            });
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                config = await res.json();
                renderStructure();
            } catch (e) { 
                document.getElementById('planContainer').innerHTML = '<div class="loading">Ошибка загрузки конфигурации</div>'; 
            }
        }

        function renderStructure() {
            if (!config || !config.floors || config.floors.length === 0) {
                document.getElementById('planContainer').innerHTML = '<div class="loading">План не настроен. Используйте админку адаптера.</div>';
                return;
            }

            // Рендер вкладок этажей
            const floorTabs = document.getElementById('floorTabs');
            floorTabs.innerHTML = '';
            if (!currentFloorId) currentFloorId = config.floors[0].id;

            config.floors.forEach(floor => {
                const btn = document.createElement('button');
                btn.className = `tab floor ${floor.id === currentFloorId ? 'active' : ''}`;
                btn.textContent = floor.name;
                btn.onclick = () => { currentFloorId = floor.id; renderStructure(); };
                floorTabs.appendChild(btn);
            });

            // Рендер вкладок слоев для текущего этажа
            const currentFloor = config.floors.find(f => f.id === currentFloorId);
            const layerTabs = document.getElementById('layerTabs');
            layerTabs.innerHTML = '';
            
            if (currentFloor && currentFloor.layers.length > 0) {
                if (!currentLayerId || !currentFloor.layers.find(l => l.id === currentLayerId)) {
                    currentLayerId = currentFloor.layers[0].id;
                }

                currentFloor.layers.forEach(layer => {
                    const btn = document.createElement('button');
                    const isActive = layer.id === currentLayerId;
                    btn.className = `tab ${isActive ? 'layer-active' : ''}`;
                    btn.textContent = layer.name;
                    if (isActive) {
                        // Применяем цвет слоя из глобальных настроек или дефолтный
                        const colors = config.globalSettings?.colors || {};
                        let color = '#34495e';
                        if (layer.type === 'lighting') color = colors.lightOn || '#f39c12';
                        else if (layer.type === 'socket') color = colors.socketOn || '#e67e22';
                        else if (layer.type === 'sensor') color = colors.sensorNormal || '#3498db';
                        else if (layer.type === 'security') color = colors.securityNormal || '#2ecc71';
                        btn.style.backgroundColor = color;
                        btn.style.borderColor = color;
                    }
                    btn.onclick = () => { currentLayerId = layer.id; renderStructure(); };
                    layerTabs.appendChild(btn);
                });
            }

            renderPlan(currentFloor);
        }

        function renderPlan(floor) {
            const container = document.getElementById('planContainer');
            if (!floor || !floor.image) { 
                container.innerHTML = '<div class="loading">Изображение плана не загружено</div>'; 
                return; 
            }
            
            container.innerHTML = `<img src="${floor.image}" class="plan-image"><div id="devicesLayer"></div>`;
            renderDevices(floor);
        }

        function renderDevices(floor) {
            const layer = document.getElementById('devicesLayer');
            if (!layer) return;
            layer.innerHTML = '';
            
            const currentLayerObj = floor.layers.find(l => l.id === currentLayerId);
            if (!currentLayerObj) return;

            const gs = config.globalSettings || {};
            const colors = gs.colors || {};
            const font = gs.sensorFont || { family: 'Arial', weight: 'bold', size: '12px', color: '#fff' };
            const size = gs.iconSize || 48;
            const opacity = gs.iconOpacity !== undefined ? gs.iconOpacity : 1.0;

            currentLayerObj.devices.forEach(dev => {
                const marker = document.createElement('div');
                marker.className = 'marker';
                marker.style.left = dev.x + '%'; 
                marker.style.top = dev.y + '%';
                marker.style.width = size + 'px';
                marker.style.height = size + 'px';
                marker.style.fontSize = (size * 0.6) + 'px'; // Для эмодзи
                marker.style.opacity = opacity;
                marker.dataset.devId = dev.id;
                
                // Определяем состояние и цвет
                let stateVal = null;
                let stateClass = 'off';
                let iconSrc = '';
                let isMfd = dev.iconType === 'mfd';

                // Для простоты берем первое значение состояния для определения цвета/статуса
                if (dev.stateIds && dev.stateIds.length > 0) {
                    stateVal = deviceStates[dev.stateIds[0]];
                }

                if (currentLayerObj.type === 'lighting') {
                    stateClass = stateVal ? 'on' : 'off';
                    marker.style.borderColor = stateVal ? (colors.lightOn || '#f39c12') : (colors.lightOff || '#7f8c8d');
                    if (stateVal) marker.style.boxShadow = `0 0 15px ${colors.lightOn || '#f39c12'}`;
                } else if (currentLayerObj.type === 'socket') {
                    stateClass = stateVal ? 'on' : 'off';
                    marker.style.borderColor = stateVal ? (colors.socketOn || '#e67e22') : (colors.socketOff || '#7f8c8d');
                } else if (currentLayerObj.type === 'sensor') {
                    // Логика для датчиков (упрощенная: если есть high/low thresholds, можно расширить)
                    stateClass = 'on'; // Датчики всегда "активны" для отображения
                    marker.style.borderColor = colors.sensorNormal || '#3498db';
                } else if (currentLayerObj.type === 'security') {
                    stateClass = stateVal ? 'triggered' : 'normal';
                    marker.style.borderColor = stateVal ? (colors.securityTriggered || '#e74c3c') : (colors.securityNormal || '#2ecc71');
                    if (stateVal) marker.style.boxShadow = `0 0 15px ${colors.securityTriggered || '#e74c3c'}`;
                }

                // Рендер иконки
                if (isMfd && dev.iconName) {
                    marker.innerHTML = `<img src="/icons-mfd-png/${dev.iconName}.png" class="mfd-icon" style="opacity: ${stateVal ? 1 : 0.4}; filter: ${stateVal ? 'none' : 'grayscale(100%)'}">`;
                } else {
                    const emoji = stateVal ? (dev.iconOn || '💡') : (dev.iconOff || '🌑');
                    marker.innerHTML = `<span class="emoji-icon" style="filter: ${stateVal ? 'none' : 'grayscale(100%) brightness(0.7)'}">${emoji}</span>`;
                }

                // Рендер значений датчика поверх иконки
                if (currentLayerObj.type === 'sensor' && dev.stateIds && dev.stateIds.length > 0) {
                    const valuesDiv = document.createElement('div');
                    valuesDiv.className = 'sensor-values';
                    valuesDiv.style.fontFamily = font.family;
                    valuesDiv.style.fontWeight = font.weight;
                    valuesDiv.style.fontSize = font.size;
                    valuesDiv.style.color = font.color;

                    dev.stateIds.forEach((sid, idx) => {
                        const val = deviceStates[sid];
                        const prefix = dev.prefixes && dev.prefixes[idx] ? dev.prefixes[idx] : '';
                        const postfix = dev.postfixes && dev.postfixes[idx] ? dev.postfixes[idx] : '';
                        const displayVal = val !== undefined && val !== null ? val : 'N/A';
                        
                        const line = document.createElement('span');
                        line.className = 'sensor-value-line';
                        line.textContent = `${prefix}${displayVal}${postfix}`;
                        valuesDiv.appendChild(line);
                    });
                    marker.appendChild(valuesDiv);
                }

                // Подпись
                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = dev.name;
                marker.appendChild(label);

                // Клик
                marker.onclick = () => toggleDevice(dev, currentLayerObj.type);
                layer.appendChild(marker);
            });
        }

        function updateAllVisualsForState(stateId, val) {
            // Перерисовываем текущий слой, чтобы обновить цвета и значения
            const floor = config.floors.find(f => f.id === currentFloorId);
            if (floor) renderDevices(floor);
        }

        async function toggleDevice(dev, layerType) {
            if (layerType === 'sensor') {
                // Для датчиков показываем все значения
                let msg = dev.name + ":\n";
                dev.stateIds.forEach((sid, idx) => {
                    const val = deviceStates[sid];
                    const prefix = dev.prefixes && dev.prefixes[idx] ? dev.prefixes[idx] : '';
                    const postfix = dev.postfixes && dev.postfixes[idx] ? dev.postfixes[idx] : '';
                    msg += `${prefix}${val !== undefined ? val : 'N/A'}${postfix}\n`;
                });
                alert(msg);
                return;
            }

            // Для переключателей (свет, розетки, безопасность)
            const currentState = deviceStates[dev.stateIds[0]] || false;
            const newVal = !currentState;
            try {
                await fetch(`/api/state/${dev.stateIds[0]}`, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({val: newVal}) 
                });
                // Состояние обновится через WebSocket
            } catch (e) { alert('Ошибка управления'); }
        }

        function subscribe() {
            if (!config) return;
            const allStates = new Set();
            config.floors.forEach(f => f.layers.forEach(l => l.devices.forEach(d => {
                if (d.stateIds) d.stateIds.forEach(sid => allStates.add(sid));
            })));

            allStates.forEach(sid => {
                socket.emit('subscribe', sid);
                socket.emit('getState', sid, (err, state) => { 
                    if (!err && state) { 
                        deviceStates[sid] = state.val; 
                    } 
                });
            });
        }

        window.onload = () => { connect(); loadConfig(); };
    </script>
</body>
</html>
