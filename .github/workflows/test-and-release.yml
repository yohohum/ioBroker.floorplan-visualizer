name: Test and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  check-and-lint:
    name: Check and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run checks
        uses: ioBroker/testing-action-check@v2
        with:
          node-version: '20'

  adapter-tests:
    name: Adapter Tests
    needs: check-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22', '24', '26']
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run adapter tests
        uses: ioBroker/testing-action-adapter@v1
        with:
          os: ${{ matrix.os }}
          node-version: ${{ matrix.node-version }}

  deploy:
    name: Deploy
    needs: [check-and-lint, adapter-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          IO_VERSION=$(node -p "require('./io-package.json').common.version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "package.json: $PKG_VERSION"
          echo "io-package.json: $IO_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$IO_VERSION" ]; then
            echo "::error::Version mismatch between package.json and io-package.json"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch between package.json and git tag"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Run all tests
        run: npm run test:all

      - name: Publish to npm (Trusted Publishing)
        uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '20'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}