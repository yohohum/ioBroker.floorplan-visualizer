<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор плана этажа v8.0</title>
<style>
:root{--md-primary:#0061a4;--md-on-primary:#fff;--md-primary-container:#d1e4ff;--md-on-primary-container:#001d36;--md-secondary-container:#d8e2ec;--md-on-secondary-container:#101c26;--md-surface:#f7f9fc;--md-surface-c1:#eef1f6;--md-surface-c2:#e8ebf1;--md-surface-c3:#e2e6ec;--md-on-surface:#1a1c20;--md-on-variant:#43484e;--md-outline:#73777f;--md-outline-v:#c3c7cf;--md-error:#ba1a1a;--md-error-c:#f9dedc;--md-success:#146c2e;--md-success-c:#c4eed0;--md-r-xl:28px;--md-r-l:16px;--md-r-m:12px;--md-r-s:8px;--md-e1:0 1px 3px rgba(0,0,0,.12);--md-e2:0 2px 6px rgba(0,0,0,.14);--md-e3:0 6px 18px rgba(0,0,0,.16)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto','Segoe UI',system-ui,sans-serif;background:var(--md-surface);color:var(--md-on-surface);padding:20px}
.container{max-width:1600px;margin:0:auto}
.header{background:var(--md-primary-container);color:var(--md-on-primary-container);padding:22px 28px;border-radius:var(--md-r-xl);margin-bottom:20px}
#debugBanner{display:none;background:var(--md-error-c);color:var(--md-error);padding:12px 20px;border-radius:var(--md-r-m);margin-bottom:15px}
.content{background:var(--md-surface-c1);border-radius:var(--md-r-xl);padding:28px}
.section h2{font-weight:500;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid var(--md-outline-v)}
.md-field{margin-bottom:14px}
.md-field label{display:block;margin-bottom:6px;font-weight:500;color:var(--md-on-variant);font-size:13px}
.md-field input,.md-field select{width:100%;padding:12px;border:1px solid var(--md-outline);border-radius:var(--md-r-s);font-size:14px;background:var(--md-surface);font-family:inherit}
/* ИСПРАВЛЕНО: цветные вводы — прямоугольники */
.md-field input[type=color],.color-item input[type=color]{width:100%;height:44px;border:1px solid var(--md-outline);border-radius:var(--md-r-s);cursor:pointer;padding:3px;background:var(--md-surface)}
.md-section{background:var(--md-surface-c2);border-radius:var(--md-r-l);padding:16px;margin-bottom:16px}
.md-section-title{font-size:14px;font-weight:500;color:var(--md-primary);margin-bottom:12px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.color-grid{display:grid;gap:10px;margin-top:8px}
.color-item{display:flex;flex-direction:column;align-items:center;gap:5px}
.color-item span{font-size:12px;color:var(--md-on-variant)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--md-on-variant);margin-top:6px}
.md-btn{border:none;border-radius:100px;padding:10px 24px;font-weight:500;font-size:14px;cursor:pointer;font-family:inherit}
.md-btn.filled{background:var(--md-primary);color:var(--md-on-primary)}
.md-btn.tonal{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.md-btn.text{background:transparent;color:var(--md-primary)}
.md-btn.danger{background:var(--md-error-c);color:var(--md-error)}
.md-btn.small{padding:6px 16px;font-size:13px}
.spacer{flex:1}
.floor-tabs-container{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid var(--md-outline-v)}
.floor-tab-editor{padding:8px 16px;background:var(--md-surface-c2);border-radius:100px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.floor-tab-editor.active{background:var(--md-primary);color:var(--md-on-primary)}
.floor-tab-editor .close-tab{background:rgba(0,0,0,.15);border:none;color:inherit;border-radius:50%;width:18px;height:18px;cursor:pointer}
.floor-workspace{display:flex;flex-direction:column;gap:15px}
.floor-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--md-surface-c2);border-radius:var(--md-r-l)}
.floor-toolbar input[type=text]{flex:1;min-width:160px;padding:10px;border:1px solid var(--md-outline);border-radius:var(--md-r-s);background:var(--md-surface)}
.layer-selector{display:flex;gap:6px;flex-wrap:wrap}
.layer-chip{padding:6px 14px;background:var(--md-surface);border:1px solid var(--md-outline-v);border-radius:100px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}
.layer-chip.active{background:var(--md-primary);color:var(--md-on-primary)}
.layer-chip .remove-layer{background:none;border:none;color:inherit;cursor:pointer}
.plan-editor-area{position:relative;width:100%;background:var(--md-surface-c3);border-radius:var(--md-r-l);overflow:hidden;min-height:500px}
.plan-editor-area img{width:100%;height:auto;display:block;user-select:none;pointer-events:none}
.plan-empty{display:flex;align-items:center;justify-content:center;min-height:500px;color:var(--md-on-variant);flex-direction:column;gap:10px}
.plan-marker{position:absolute;border-radius:50%;background:#fff;border:3px solid var(--md-primary);display:flex;align-items:center;justify-content:center;cursor:move;user-select:none;z-index:10;transform:translate(-50%,-50%);box-shadow:var(--md-e2)}
.plan-marker .marker-icon{pointer-events:none;line-height:1}
.plan-marker .live-val{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--md-on-variant);white-space:nowrap}
.icon-mask{display:inline-block;width:100%;height:100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;pointer-events:none}
.lbl{position:absolute;pointer-events:none;white-space:nowrap;padding:2px 8px;border-radius:6px;z-index:21}
.lbl-pos-bottom{top:100%;left:50%;transform:translate(-50%,4px)}
.lbl-pos-top{bottom:100%;left:50%;transform:translate(-50%,-4px)}
.lbl-pos-right{left:100%;top:50%;transform:translate(4px,-50%)}
.lbl-pos-left{right:100%;top:50%;transform:translate(-4px,-50%)}
.lbl-pos-overlay{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;white-space:normal;width:max-content;max-width:150%}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--md-surface-c2);border-radius:var(--md-r-xl);padding:24px;max-width:800px;width:92%;max-height:88vh;overflow-y:auto;box-shadow:var(--md-e3)}
.modal h2{margin-bottom:18px;font-weight:500}
.md-actions{display:flex;gap:8px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--md-outline-v)}
.modal-large{max-width:900px}
.slot-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:var(--md-surface);border:1px solid var(--md-outline-v);border-radius:var(--md-r-m);padding:8px}
.slot-row .slot-label{width:110px;font-size:13px;font-weight:500;color:var(--md-on-variant)}
.slot-row .slot-preview{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--md-surface-c2);border-radius:50%;font-size:22px;flex:0 0 44px}
.object-tree-search{margin-bottom:10px;display:flex;gap:6px}
.object-tree-search input{flex:1;padding:10px;border:1px solid var(--md-outline);border-radius:var(--md-r-s);background:var(--md-surface)}
.object-tree{border:1px solid var(--md-outline-v);border-radius:var(--md-r-m);max-height:450px;overflow-y:auto;background:var(--md-surface);font-size:13px}
.tree-branch-header{padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.tree-branch-header:hover{background:var(--md-primary-container)}
.branch-toggle{width:14px;color:var(--md-primary);font-size:10px}
.branch-name{font-weight:500}.branch-count{color:var(--md-on-variant);font-size:11px}
.tree-meta{color:var(--md-on-variant);font-size:11px}
.tree-node{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tree-node:hover{background:var(--md-primary-container)}
.tree-node.selected{background:var(--md-primary);color:var(--md-on-primary)}
.tree-node .tree-id{font-family:Consolas,monospace;font-size:11px;color:var(--md-on-variant);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-loading,.tree-empty{padding:20px;text-align:center;color:var(--md-on-variant)}
.icon-palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;max-height:400px;overflow-y:auto;border:1px solid var(--md-outline-v);border-radius:var(--md-r-m);padding:10px;background:var(--md-surface)}
.icon-option{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;border-radius:var(--md-r-m);cursor:pointer;padding:5px;gap:4px}
.icon-option:hover{background:var(--md-primary-container)}
.icon-option.selected{background:var(--md-primary)}
.icon-option .icon-preview{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.icon-option .icon-name{font-size:9px;text-align:center;color:var(--md-on-variant);word-break:break-all;max-height:22px;overflow:hidden}
.id-input-wrapper{display:flex;gap:6px}.id-input-wrapper input{flex:1}
.extra-id-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.extra-id-row input{flex:1;padding:8px;border:1px solid var(--md-outline);border-radius:var(--md-r-s);background:var(--md-surface)}
.extra-ids-label{font-size:12px;color:var(--md-on-variant);margin:10px 0 6px}
.ctx-menu{position:fixed;z-index:3000;background:var(--md-surface-c2);border-radius:var(--md-r-m);box-shadow:var(--md-e3);min-width:170px;padding:6px;display:none}
.ctx-menu.active{display:block}
.ctx-item{padding:10px 16px;border-radius:var(--md-r-s);cursor:pointer;font-size:14px}
.ctx-item:hover{background:var(--md-primary-container)}
.ctx-item.danger{color:var(--md-error)}
</style>
</head>
<body>
<div class="container">
 <div id="debugBanner"></div>
 <div class="header"><h1>Редактор плана этажа</h1><p>Размещение объектов умного дома</p></div>
 <div class="content"><div class="section"><h2>Этажи</h2><div class="floor-tabs-container" id="floorTabsEditor"></div><div class="floor-workspace" id="floorWorkspace"></div></div></div>
</div>
<input type="file" id="diskIconInput" accept="image/*" style="display:none">

<div class="modal-overlay" id="deviceModal"><div class="modal">
 <h2 id="deviceModalTitle">Объект</h2>
 <div class="md-field"><label>Название объекта</label><input type="text" id="deviceName"></div>
 <div class="settings-grid">
  <div class="md-field"><label>Тип объекта</label><select id="deviceObjType" onchange="onObjTypeChange()"><option value="switch">Переключатель</option><option value="value_write">Значение (ввод)</option><option value="list">Список</option><option value="indicator">Индикатор</option><option value="value_read">Значение (чтение)</option></select></div>
  <div class="md-field"><label>Слой отображения</label><select id="deviceLayer"></select></div>
 </div>
 <div class="md-field"><label>Состояние ioBroker</label><div class="id-input-wrapper"><input type="text" id="deviceId"><button class="md-btn tonal small" onclick="openObjectTree('main',-1)">🔍 Обзор</button></div></div>
 <div class="md-field" id="listValuesField" style="display:none"><label>Значения списка (через запятую)</label><input type="text" id="deviceListValues"></div>
 <div class="md-field" id="thresholdFields" style="display:none"><div class="settings-grid">
  <div class="md-field"><label>Тревога мин (ниже)</label><input type="number" id="warnBelow"></div>
  <div class="md-field"><label>Тревога макс (выше)</label><input type="number" id="warnAbove"></div></div></div>
 <div class="md-field"><div class="extra-ids-label">Дополнительные состояния:</div><div id="extraIdsContainer"></div><button class="md-btn tonal small" onclick="addExtraIdRow()">+ Добавить состояние</button></div>

 <div class="md-section"><div class="md-section-title">Иконка</div>
  <div class="settings-grid">
   <div class="md-field"><label>Размер (px)</label><input type="number" id="iconSize"></div>
   <div class="md-field"><label>Прозрачность</label><input type="number" id="iconOpacity" step="0.1" min="0" max="1"></div>
  </div>
  <div id="iconSlots"></div>
  <div class="md-field"><label>Цвет фона</label><div class="color-grid" id="colBg"></div></div>
  <div class="md-field"><label>Цвет иконки</label><div class="color-grid" id="colIc"></div></div>
  <div class="md-field"><label>Цвет рамки</label><div class="color-grid" id="colBd"></div></div>
 </div>

 <div class="md-section"><div class="md-section-title">Шрифт значения</div>
  <label class="chk"><input type="checkbox" id="vf-show" checked> Выводить значение</label>
  <div class="settings-grid">
   <div class="md-field"><label>Шрифт</label><input type="text" id="vf-family"></div>
   <div class="md-field"><label>Начертание</label><select id="vf-weight"><option>normal</option><option>bold</option><option>300</option><option>500</option></select></div>
   <div class="md-field"><label>Размер</label><input type="text" id="vf-size"></div>
   <div class="md-field"><label>Цвет шрифта</label><input type="color" id="vf-color"></div>
   <div class="md-field"><label>Цвет фона</label><input type="color" id="vf-bg"></div>
   <div class="md-field"><label>Расположение</label><select id="vf-position"><option value="bottom">Снизу</option><option value="top">Сверху</option><option value="right">Справа</option><option value="left">Слева</option><option value="overlay">Поверх</option></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="vf-nobg"> Фон прозрачный</label>
  <div class="settings-grid" style="margin-top:10px">
   <div class="md-field"><label>Префиксы</label><input type="text" id="devicePrefixes"></div>
   <div class="md-field"><label>Постфиксы</label><input type="text" id="devicePostfixes"></div></div>
 </div>

 <div class="md-section"><div class="md-section-title">Шрифт названия</div>
  <label class="chk"><input type="checkbox" id="nf-show" checked> Выводить название</label>
  <div class="settings-grid">
   <div class="md-field"><label>Шрифт</label><input type="text" id="nf-family"></div>
   <div class="md-field"><label>Начертание</label><select id="nf-weight"><option>normal</option><option>bold</option><option>300</option><option>500</option></select></div>
   <div class="md-field"><label>Размер</label><input type="text" id="nf-size"></div>
   <div class="md-field"><label>Цвет шрифта</label><input type="color" id="nf-color"></div>
   <div class="md-field"><label>Цвет фона</label><input type="color" id="nf-bg"></div>
   <div class="md-field"><label>Расположение</label><select id="nf-position"><option value="bottom">Снизу</option><option value="top">Сверху</option><option value="right">Справа</option><option value="left">Слева</option><option value="overlay">Поверх</option></select></div>
  </div>
  <label class="chk"><input type="checkbox" id="nf-nobg"> Фон прозрачный</label>
 </div>

 <div class="md-actions"><button class="md-btn danger" id="btnDeleteDevice" onclick="deleteDevice()">Удалить</button><span class="spacer"></span><button class="md-btn text" onclick="cancelDevice()">Отменить</button><button class="md-btn filled" onclick="saveDevice()">Сохранить</button></div>
</div></div>

<div class="modal-overlay" id="treeModal"><div class="modal modal-large"><h2>Выбор объекта ioBroker</h2>
 <div class="object-tree-search"><input type="text" id="treeSearch" placeholder="🔍 Поиск" oninput="filterTree()"><button class="md-btn tonal small" onclick="expandAllBranches()">Развернуть</button><button class="md-btn tonal small" onclick="collapseAllBranches()">Свернуть</button></div>
 <div class="object-tree" id="objectTree"><div class="tree-loading">Загрузка...</div></div>
 <div class="md-actions"><span class="spacer"></span><button class="md-btn text" onclick="closeTreeModal()">Закрыть</button></div></div></div>

<div class="modal-overlay" id="emojiModal"><div class="modal"><h2>Выбор Emoji</h2><div class="icon-palette" id="emojiPalette"></div>
 <div class="md-actions"><span class="spacer"></span><button class="md-btn text" onclick="closeEmojiModal()">Закрыть</button></div></div></div>
<div class="modal-overlay" id="mfdModal"><div class="modal modal-large"><h2>Выбор MFD-иконки</h2>
 <div class="object-tree-search"><input type="text" id="mfdSearch" placeholder="🔍 Поиск" oninput="filterMfdPalette()"></div>
 <div class="icon-palette" id="mfdPalette"><div class="tree-loading">Загрузка...</div></div>
 <div class="md-actions"><span class="spacer"></span><button class="md-btn text" onclick="closeMfdModal()">Закрыть</button></div></div></div>

<script>
'use strict';
var config=null,currentFloorId=null,currentLayerId=null,liveStates={};
var allIoBrokerObjects=null,ioBrokerTree=null,expandedPaths=new Set(),objectTreeContext=null;
var allMfdIcons=null,mfdBaseUrl='/icons-mfd-png/';
var editingDevice=null,editingLayerRef=null,editingIsNew=false,slotTarget=null,liveTimer=null;
var CACHE_BUSTER='?v='+Date.now();
var emojiGroups={'Освещение':['💡','🔆','💫','🕯️','✨'],'Розетки':['🔌','','🔋'],'Климат':['️','❄️',''],'Безопасность':['🔒','📹','️'],'Мультимедиа':['🔊','']};

function showDebug(m){var b=document.getElementById('debugBanner');if(b){b.style.display='block';b.textContent=m;}}
window.addEventListener('error',function(e){showDebug('JS: '+e.message+' ('+e.lineno+')');});
function esc(s){return(s==null)?'':String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function splitList(v){return String(v||'').split(',').map(s=>s.trim()).filter(Boolean);}
function gv(id){return document.getElementById(id).value;}
function sv(id,v){document.getElementById(id).value=v;}
function ensureConfig(){if(!config||typeof config!=='object')config={};if(!Array.isArray(config.floors))config.floors=[];}
function isValue(t){return t==='value_read'||t==='value_write';}
function iconStates(){return isValue(gv('deviceObjType'))?[{k:'min',l:'Тревога мин'},{k:'norm',l:'Норма'},{k:'max',l:'Тревога макс'}]:[{k:'on',l:'Вкл'},{k:'off',l:'Выкл'}];}
function defColor(k){return{k:'',on:'#0cbaba',off:'#7f8c8d',min:'#e74c3c',norm:'#2ecc71',max:'#e74c3c'}[k]||'#000';}
function getStateKey(dev,v){var t=dev.objType||'switch';if(isValue(t)){var n=parseFloat(v);if(!isNaN(n)){if(dev.warnBelow!==''&&dev.warnBelow!=null&&n<+dev.warnBelow)return'min';if(dev.warnAbove!==''&&dev.warnAbove!=null&&n>+dev.warnAbove)return'max';}return'norm';}return v?'on':'off';}
function defaultSlots(t){return isValue(t)?{min:{kind:'emoji',value:'⚠️'},norm:{kind:'emoji',value:'🟢'},max:{kind:'emoji',value:'🔺'}}:{on:{kind:'emoji',value:'💡'},off:{kind:'emoji',value:'🌑'}};}
function defaultIcon(t){var keys=isValue(t)?['min','norm','max']:['on','off'];var bg={},co={},bd={};keys.forEach(k=>{bg[k]='#ffffff';co[k]=defColor(k);bd[k]=defColor(k);});return{size:48,opacity:1,bg:bg,color:co,border:bd,slots:defaultSlots(t)};}
function applyFont(el,f){el.style.fontFamily=f.family;el.style.fontWeight=f.weight;el.style.fontSize=f.size;el.style.color=f.color;if(f.bgColor&&f.bgColor!=='transparent')el.style.backgroundColor=f.bgColor;}
document.addEventListener('DOMContentLoaded',loadConfig);
function loadConfig(){fetch('/api/config').then(r=>r.json()).then(d=>{config=d;ensureConfig();renderFloorWorkspace();}).catch(e=>{ensureConfig();renderFloorWorkspace();showDebug('Ошибка: '+e.message);});}
function saveConfig(cb){fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}).then(()=>{if(cb)cb();}).catch(e=>showDebug('Ошибка сохранения'));}

// ===== ЭТАЖИ =====
function renderFloorTabs(){var c=document.getElementById('floorTabsEditor');var h='';for(var i=0;i<config.floors.length;i++){var f=config.floors[i];h+='<div class="floor-tab-editor'+(f.id===currentFloorId?' active':'')+'" onclick="selectFloor(\''+f.id+'\')"><span>'+esc(f.name)+'</span><button class="close-tab" onclick="removeFloor('+i+',event)">×</button></div>';}h+='<button class="md-btn filled small" onclick="addFloor()">+ Этаж</button>';c.innerHTML=h;}
function addFloor(){ensureConfig();var id='floor_'+Date.now();config.floors.push({id:id,name:'Новый этаж',image:'',layers:[]});currentFloorId=id;currentLayerId=null;saveConfig(renderFloorWorkspace);}
function removeFloor(i,e){if(e)e.stopPropagation();if(!confirm('Удалить этаж?'))return;var rid=config.floors[i].id;config.floors.splice(i,1);if(currentFloorId===rid){currentFloorId=config.floors[0]?config.floors[0].id:null;}saveConfig(renderFloorWorkspace);}
function selectFloor(id){currentFloorId=id;currentLayerId=null;renderFloorWorkspace();}
function getCurrentFloor(){for(var i=0;i<config.floors.length;i++)if(config.floors[i].id===currentFloorId)return{floor:config.floors[i],idx:i};return null;}
function renderFloorWorkspace(){renderFloorTabs();var w=document.getElementById('floorWorkspace');var cur=getCurrentFloor();if(!cur){w.innerHTML='<div class="plan-empty">🏠 Добавьте этаж</div>';stopLive();return;}
var floor=cur.floor,fIdx=cur.idx;
if(!currentLayerId||!floor.layers.some(l=>l.id===currentLayerId))currentLayerId=floor.layers[0]?floor.layers[0].id:null;
var chips='';floor.layers.forEach(l=>{chips+='<div class="layer-chip'+(l.id===currentLayerId?' active':'')+'" onclick="selectLayer(\''+l.id+'\')"><span>'+esc(l.name)+'</span><button class="remove-layer" onclick="removeLayer('+fIdx+',\''+l.id+'\',event)">×</button></div>';});
var h='<div class="floor-toolbar"><input type="text" value="'+esc(floor.name)+'" id="floorNameInput"><button class="md-btn filled small" onclick="saveFloorName('+fIdx+')">💾</button><button class="md-btn tonal small" onclick="document.getElementById(\'floorImageInput\').click()">🖼️ План</button><input type="file" id="floorImageInput" accept="image/*" style="display:none" onchange="handleImageUpload(this,'+fIdx+')"></div>';
h+='<div class="floor-toolbar"><strong>Слои:</strong><div class="layer-selector">'+chips+'<button class="md-btn tonal small" onclick="addLayer('+fIdx+')">+ Слой</button></div><span class="spacer"></span><button class="md-btn filled small" onclick="openAddDeviceModal('+fIdx+')">+ Добавить объект</button></div>';
if(floor.image)h+='<div class="plan-editor-area" id="planEditorArea"><img src="'+floor.image+CACHE_BUSTER+'" id="planEditorImage"></div>';
else h+='<div class="plan-editor-area"><div class="plan-empty">🖼️ Загрузите план</div></div>';
w.innerHTML=h;if(floor.image){renderPlanMarkers(floor,fIdx);startLive();}else stopLive();}
function selectLayer(id){currentLayerId=id;renderFloorWorkspace();}
function addLayer(fIdx){var n=prompt('Название слоя:','Новый слой');if(!n)return;var f=config.floors[fIdx];if(!f.layers)f.layers=[];var nl={id:'layer_'+Date.now(),name:n,devices:[]};f.layers.push(nl);currentLayerId=nl.id;saveConfig(renderFloorWorkspace);}
function removeLayer(fIdx,lId,e){if(e)e.stopPropagation();if(!confirm('Удалить слой?'))return;var f=config.floors[fIdx];var i=f.layers.findIndex(l=>l.id===lId);if(i>=0)f.layers.splice(i,1);if(currentLayerId===lId)currentLayerId=null;saveConfig(renderFloorWorkspace);}
function saveFloorName(fIdx){config.floors[fIdx].name=gv('floorNameInput')||'Без названия';saveConfig(renderFloorTabs);}
function handleImageUpload(inp,fIdx){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:'floor_'+fIdx+'_'+Date.now()+'.png',base64Data:e.target.result})}).then(x=>x.json()).then(d=>{if(d.success){config.floors[fIdx].image=d.url;saveConfig(renderFloorWorkspace);}});};r.readAsDataURL(f);}

// ===== ЖИВЫЕ ДАННЫЕ В РЕДАКТОРЕ =====
function collectStates(){var ids=[];var cur=getCurrentFloor();if(!cur)return ids;var fl=cur.floor; (fl.layers||[]).forEach(l=>{(l.devices||[]).forEach(d=>{(d.stateIds||[]).forEach(s=>{if(s&&ids.indexOf(s)<0)ids.push(s);});});});return ids;}
function startLive(){stopLive();pollLive();liveTimer=setInterval(pollLive,2000);}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null;}}
function pollLive(){var ids=collectStates();ids.forEach(sid=>{fetch('/api/state/'+sid).then(r=>r.json()).then(d=>{if(d&&liveStates[sid]!==d.val){liveStates[sid]=d.val;updateLiveLabels();}}).catch(()=>{});});}
function updateLiveLabels(){var cur=getCurrentFloor();if(!cur)return;var fl=cur.floor;(fl.layers||[]).forEach(l=>{(l.devices||[]).forEach(d=>{var el=document.querySelector('[data-live-id="'+d.id+'"]');if(el){var v=liveStates[d.stateIds&&d.stateIds[0]];el.textContent=(v!==undefined&&v!==null)?v:'';}});});}

// ===== МАРКЕРЫ + ПКМ =====
var ctxMenuEl=null;function hideCtxMenu(){if(ctxMenuEl)ctxMenuEl.classList.remove('active');}
function showCtxMenu(x,y,items){if(!ctxMenuEl){ctxMenuEl=document.createElement('div');ctxMenuEl.className='ctx-menu';document.body.appendChild(ctxMenuEl);document.addEventListener('click',hideCtxMenu);}ctxMenuEl.innerHTML='';items.forEach(it=>{var d=document.createElement('div');d.className='ctx-item'+(it.danger?' danger':'');d.textContent=it.label;d.onclick=function(e){e.stopPropagation();hideCtxMenu();it.action();};ctxMenuEl.appendChild(d);});ctxMenuEl.style.left=Math.min(x,innerWidth-190)+'px';ctxMenuEl.style.top=Math.min(y,innerHeight-140)+'px';ctxMenuEl.classList.add('active');}
function slotHtml(slot,color){if(!slot)return'<span class="marker-icon">•</span>';if(slot.kind==='emoji')return'<span class="marker-icon">'+esc(slot.value)+'</span>';var u=slot.kind==='mfd'?(mfdBaseUrl+slot.value+'.png'):slot.value;return'<span class="icon-mask" style="background-color:'+color+';-webkit-mask-image:url('+u+');mask-image:url('+u+');"></span>';}
function renderPlanMarkers(floor,fIdx){var area=document.getElementById('planEditorArea');if(!area)return;area.querySelectorAll('.plan-marker').forEach(m=>m.remove());if(!currentLayerId)return;
var layer=null,lIdx=-1;for(var i=0;i<floor.layers.length;i++)if(floor.layers[i].id===currentLayerId){layer=floor.layers[i];lIdx=i;break;}if(!layer)return;
(layer.devices||[]).forEach(dev=>{var ic=dev.icon||defaultIcon(dev.objType);var key=getStateKey(dev,liveStates[dev.stateIds&&dev.stateIds[0]]);
 var m=document.createElement('div');m.className='plan-marker';m.style.left=(dev.x||50)+'%';m.style.top=(dev.y||50)+'%';m.style.width=(ic.size||48)+'px';m.style.height=(ic.size||48)+'px';m.style.opacity=ic.opacity!=null?ic.opacity:1;
 m.style.backgroundColor=(ic.bg&&ic.bg[key])||'#fff';m.style.borderColor=(ic.border&&ic.border[key])||defColor(key);
 m.innerHTML=slotHtml((ic.slots||{})[key],(ic.color&&ic.color[key])||defColor(key));
 if(dev.showValue!==false){var lv=document.createElement('span');lv.className='live-val';lv.dataset.liveId=dev.id;lv.textContent=(liveStates[dev.stateIds&&dev.stateIds[0]]!==undefined)?liveStates[dev.stateIds&&dev.stateIds[0]]:'';m.appendChild(lv);}
 attachDrag(m,dev);
 m.addEventListener('dblclick',function(e){e.preventDefault();openEditDeviceModal(fIdx,lIdx,dev.id);});
 m.addEventListener('contextmenu',function(e){e.preventDefault();showCtxMenu(e.clientX,e.clientY,[{label:'✏️ Редактировать',action:function(){openEditDeviceModal(fIdx,lIdx,dev.id);}},{label:'⧉ Копировать',action:function(){copyDevice(fIdx,lIdx,dev.id);}},{label:'🗑 Удалить',danger:true,action:function(){deleteDeviceById(fIdx,lIdx,dev.id);}}]);});
 area.appendChild(m);});updateLiveLabels();}
function copyDevice(fIdx,lIdx,id){var l=config.floors[fIdx].layers[lIdx];var s=l.devices.find(d=>d.id===id);if(!s)return;var c=JSON.parse(JSON.stringify(s));c.id='dev_'+Date.now();c.x=Math.min(100,(s.x||50)+4);c.y=Math.min(100,(s.y||50)+4);l.devices.push(c);saveConfig(renderFloorWorkspace);}
function deleteDeviceById(fIdx,lIdx,id){if(!confirm('Удалить объект?'))return;var l=config.floors[fIdx].layers[lIdx];l.devices=l.devices.filter(d=>d.id!==id);saveConfig(renderFloorWorkspace);}
function attachDrag(m,dev){m.addEventListener('mousedown',function(e){if(e.button!==0)return;e.preventDefault();var st=false;var img=document.getElementById('planEditorImage');if(!img)return;function mv(ev){var r=img.getBoundingClientRect();var x=((ev.clientX-r.left)/r.width)*100,y=((ev.clientY-r.top)/r.height)*100;dev.x=Math.max(0,Math.min(100,x));dev.y=Math.max(0,Math.min(100,y));m.style.left=dev.x+'%';m.style.top=dev.y+'%';st=true;}function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);if(st)saveConfig();}document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});}

function openAddDeviceModal(fIdx){var f=config.floors[fIdx];if(!f.layers||!f.layers.length){alert('Добавьте слой');return;}var lIdx=f.layers.findIndex(l=>l.id===currentLayerId);if(lIdx<0)lIdx=0;
 editingDevice={id:'dev_'+Date.now(),name:'',stateIds:[],objType:'switch',listValues:[],prefixes:[],postfixes:[],x:50,y:50,showValue:true,showName:true};
 editingDevice.icon=defaultIcon('switch');editingLayerRef={fIdx:fIdx,lIdx:lIdx};editingIsNew=true;sv('deviceModalTitle','Новый объект');fillDeviceModal();document.getElementById('deviceModal').classList.add('active');}
function openEditDeviceModal(fIdx,lIdx,id){var l=config.floors[fIdx].layers[lIdx];var d=l.devices.find(x=>x.id===id);if(!d)return;editingDevice=JSON.parse(JSON.stringify(d));editingLayerRef={fIdx:fIdx,lIdx:lIdx};editingIsNew=false;sv('deviceModalTitle','Объект: '+(d.name||''));fillDeviceModal();document.getElementById('deviceModal').classList.add('active');}
function fillDeviceModal(){var d=editingDevice,f=config.floors[editingLayerRef.fIdx];
 sv('deviceName',d.name||'');sv('deviceObjType',d.objType||'switch');sv('deviceId',(d.stateIds&&d.stateIds[0])||'');sv('deviceListValues',(d.listValues||[]).join(', '));sv('warnBelow',d.warnBelow!=null?d.warnBelow:'');sv('warnAbove',d.warnAbove!=null?d.warnAbove:'');
 var ls=document.getElementById('deviceLayer');ls.innerHTML='';f.layers.forEach((l,i)=>{var o=document.createElement('option');o.value=l.id;o.textContent=l.name;if(i===editingLayerRef.lIdx)o.selected=true;ls.appendChild(o);});
 document.getElementById('extraIdsContainer').innerHTML='';if(d.stateIds)for(var j=1;j<d.stateIds.length;j++)addExtraIdRow(d.stateIds[j]);
 if(!d.icon)d.icon=defaultIcon(d.objType);if(!d.icon.slots)d.icon.slots=defaultSlots(d.objType);
 sv('iconSize',d.icon.size||48);sv('iconOpacity',d.icon.opacity!=null?d.icon.opacity:1);
 var vf=d.valueFont||{};document.getElementById('vf-show').checked=d.showValue!==false;sv('vf-family',vf.family||'Arial');sv('vf-weight',vf.weight||'bold');sv('vf-size',vf.size||'12px');sv('vf-color',vf.color||'#ffffff');sv('vf-bg',vf.bgColor&&vf.bgColor!=='transparent'?vf.bgColor:'#000000');document.getElementById('vf-nobg').checked=(vf.bgColor==='transparent'||!vf.bgColor);sv('vf-position',vf.position||'overlay');
 var nf=d.nameFont||{};document.getElementById('nf-show').checked=d.showName!==false;sv('nf-family',nf.family||'Arial');sv('nf-weight',nf.weight||'normal');sv('nf-size',nf.size||'12px');sv('nf-color',nf.color||'#ffffff');sv('nf-bg',nf.bgColor&&nf.bgColor!=='transparent'?nf.bgColor:'#000000');document.getElementById('nf-nobg').checked=(nf.bgColor==='transparent'||!nf.bgColor);sv('nf-position',nf.position||'bottom');
 sv('devicePrefixes',(d.prefixes||[]).join(', '));sv('devicePostfixes',(d.postfixes||[]).join(', '));
 document.getElementById('btnDeleteDevice').style.display=editingIsNew?'none':'inline-block';
 onObjTypeChange();}
function buildIconUI(){var d=editingDevice,ic=d.icon,states=iconStates();
 var sh='';states.forEach(st=>{var slot=(ic.slots||{})[st.k];var prev=slot?(slot.kind==='emoji'?slot.value:'🖼'):'•';
  sh+='<div class="slot-row"><div class="slot-label">'+st.l+'</div><div class="slot-preview">'+prev+'</div>'+
  '<button class="md-btn tonal small" onclick="openEmojiForSlot(\''+st.k+'\')">Emoji</button>'+
  '<button class="md-btn tonal small" onclick="openMfdForSlot(\''+st.k+'\')">MFD</button>'+
  '<button class="md-btn tonal small" onclick="openDiskForSlot(\''+st.k+'\')">📁 С диска</button></div>';});
 document.getElementById('iconSlots').innerHTML=sh;
 var cols=states.length;
 ['colBg','colIc','colBd'].forEach(function(cid,idx){var prop=['bg','color','border'][idx];var el=document.getElementById(cid);el.style.gridTemplateColumns='repeat('+cols+',1fr)';var h='';states.forEach(st=>{var v=(ic[prop]&&ic[prop][st.k])|| (prop==='bg'?'#ffffff':defColor(st.k));h+='<div class="color-item"><input type="color" data-prop="'+prop+'" data-key="'+st.k+'" value="'+v+'"><span>'+st.l+'</span></div>';});el.innerHTML=h;});}
function onObjTypeChange(){var t=gv('deviceObjType');var val=isValue(t);
 document.getElementById('listValuesField').style.display=(t==='list')?'block':'none';
 document.getElementById('thresholdFields').style.display=val?'block':'none';
 // пересоздать слоты/цвета под тип, сохранив общее
 var d=editingDevice;if(!d.icon)d.icon=defaultIcon(t);
 var keys=val?['min','norm','max']:['on','off'];
 if(!d.icon.slots)d.icon.slots={};keys.forEach(k=>{if(!d.icon.slots[k])d.icon.slots[k]=defaultSlots(t)[k];});
 ['bg','color','border'].forEach(p=>{if(!d.icon[p])d.icon[p]={};keys.forEach(k=>{if(!d.icon[p][k])d.icon[p][k]=(p==='bg'?'#ffffff':defColor(k));});});
 buildIconUI();}
function readIcon(){var d=editingDevice,ic=d.icon;ic.size=+gv('iconSize');ic.opacity=+gv('iconOpacity');
 document.querySelectorAll('#colBg input,#colIc input,#colBd input').forEach(inp=>{var p=inp.dataset.prop,k=inp.dataset.key;if(!ic[p])ic[p]={};ic[p][k]=inp.value;});}
function saveDevice(){readIcon();var d=editingDevice;d.name=gv('deviceName');d.objType=gv('deviceObjType');
 var main=gv('deviceId').trim();var ids=[];if(main)ids.push(main);document.querySelectorAll('.extra-id-input').forEach(i=>{var v=i.value.trim();if(v)ids.push(v);});d.stateIds=ids;
 d.listValues=splitList(gv('deviceListValues'));d.warnBelow=gv('warnBelow');d.warnAbove=gv('warnAbove');
 d.showValue=document.getElementById('vf-show').checked;d.showName=document.getElementById('nf-show').checked;
 d.valueFont={family:gv('vf-family'),weight:gv('vf-weight'),size:gv('vf-size'),color:gv('vf-color'),bgColor:document.getElementById('vf-nobg').checked?'transparent':gv('vf-bg'),position:gv('vf-position')};
 d.nameFont={family:gv('nf-family'),weight:gv('nf-weight'),size:gv('nf-size'),color:gv('nf-color'),bgColor:document.getElementById('nf-nobg').checked?'transparent':gv('nf-bg'),position:gv('nf-position')};
 d.prefixes=splitList(gv('devicePrefixes'));d.postfixes=splitList(gv('devicePostfixes'));
 if(!d.name){alert('Введите название');return;}
 var f=config.floors[editingLayerRef.fIdx];var toIdx=f.layers.findIndex(l=>l.id===gv('deviceLayer'));if(toIdx<0)toIdx=editingLayerRef.lIdx;
 if(editingIsNew)f.layers[toIdx].devices.push(d);else{var from=f.layers[editingLayerRef.lIdx];var i=from.devices.findIndex(x=>x.id===d.id);if(i>=0)from.devices.splice(i,1);f.layers[toIdx].devices.push(d);}
 closeDeviceModal();saveConfig(function(){currentLayerId=f.layers[toIdx].id;renderFloorWorkspace();});}
function cancelDevice(){closeDeviceModal();}
function deleteDevice(){if(editingIsNew)return;if(!confirm('Удалить?'))return;var f=config.floors[editingLayerRef.fIdx];f.layers[editingLayerRef.lIdx].devices=f.layers[editingLayerRef.lIdx].devices.filter(x=>x.id!==editingDevice.id);closeDeviceModal();saveConfig(renderFloorWorkspace);}
function closeDeviceModal(){document.getElementById('deviceModal').classList.remove('active');editingDevice=null;}
function addExtraIdRow(v){var c=document.getElementById('extraIdsContainer');var r=document.createElement('div');r.className='extra-id-row';r.innerHTML='<input type="text" class="extra-id-input" value="'+esc(v||'')+'"><button class="md-btn tonal small" onclick="openObjectTreeForExtra(this)">🔍</button><button class="md-btn danger small" onclick="this.parentNode.remove()">×</button>';c.appendChild(r);}
function setExtraIdValue(i,v){var r=document.querySelectorAll('.extra-id-input');if(r[i])r[i].value=v;}
function openObjectTreeForExtra(btn){var c=document.getElementById('extraIdsContainer');openObjectTree('extra',Array.prototype.indexOf.call(c.children,btn.parentNode));}

// ===== СЛОТЫ: emoji / mfd / диск =====
function openEmojiForSlot(k){slotTarget=k;var p=document.getElementById('emojiPalette');var h='';for(var g in emojiGroups){h+='<div style="grid-column:1/-1;font-weight:500;color:var(--md-primary)">'+g+'</div>';emojiGroups[g].forEach(e=>{h+='<div class="icon-option" onclick="selectEmoji(\''+e+'\')"><div class="icon-preview">'+e+'</div></div>';});}p.innerHTML=h;document.getElementById('emojiModal').classList.add('active');}
function selectEmoji(e){if(slotTarget&&editingDevice){if(!editingDevice.icon.slots)editingDevice.icon.slots={};editingDevice.icon.slots[slotTarget]={kind:'emoji',value:e};buildIconUI();}closeEmojiModal();}
function closeEmojiModal(){document.getElementById('emojiModal').classList.remove('active');}
function openMfdForSlot(k){slotTarget=k;CACHE_BUSTER='?v='+Date.now();document.getElementById('mfdModal').classList.add('active');sv('mfdSearch','');if(!allMfdIcons)loadMfdIcons();else renderMfdPalette(allMfdIcons);}
function closeMfdModal(){document.getElementById('mfdModal').classList.remove('active');}
function loadMfdIcons(){fetch('/api/iobroker/icons').then(r=>r.json()).then(d=>{allMfdIcons=d.icons||[];mfdBaseUrl=d.baseUrl||'/icons-mfd-png/';renderMfdPalette(allMfdIcons);}).catch(()=>{});}
function renderMfdPalette(icons){var s=gv('mfdSearch').toLowerCase().trim();var f=icons.filter(n=>!s||n.indexOf(s)!==-1);var p=document.getElementById('mfdPalette');if(!f.length){p.innerHTML='<div class="tree-empty">Нет</div>';return;}var h='';f.slice(0,500).forEach(n=>{var u=mfdBaseUrl+esc(n)+'.png'+CACHE_BUSTER;h+='<div class="icon-option" onclick="selectMfd(\''+esc(n).replace(/'/g,"\\'")+'\')"><div class="icon-preview"><span class="icon-mask" style="width:32px;height:32px;background-color:#000;-webkit-mask-image:url('+u+');mask-image:url('+u+');"></span></div><div class="icon-name">'+esc(n)+'</div></div>';});p.innerHTML=h;}
function filterMfdPalette(){if(allMfdIcons)renderMfdPalette(allMfdIcons);}
function selectMfd(n){if(slotTarget&&editingDevice){if(!editingDevice.icon.slots)editingDevice.icon.slots={};editingDevice.icon.slots[slotTarget]={kind:'mfd',value:n};buildIconUI();}closeMfdModal();}
function openDiskForSlot(k){slotTarget=k;document.getElementById('diskIconInput').click();}
document.getElementById('diskIconInput').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:'icon_'+Date.now()+'.png',base64Data:e.target.result})}).then(x=>x.json()).then(d=>{if(d.success&&slotTarget&&editingDevice){if(!editingDevice.icon.slots)editingDevice.icon.slots={};editingDevice.icon.slots[slotTarget]={kind:'url',value:d.url};buildIconUI();}});};r.readAsDataURL(f);this.value='';});

// ===== ДЕРЕВО =====
function buildIoBrokerTree(o){var r={children:{},leaf:null};o.forEach(obj=>{var p=obj.id.split('.');var n=r;for(var i=0;i<p.length;i++){var k=p[i];if(!n.children[k])n.children[k]={children:{},leaf:null};n=n.children[k];if(i===p.length-1)n.leaf=obj;}});return r;}
function countLeaves(n){var c=n.leaf?1:0;for(var k in n.children)c+=countLeaves(n.children[k]);return c;}
function nodeMeta(o){if(!o)return'';var a=[o.room,o.func].filter(Boolean);return a.length?(', '+a.join(', ')):'';}
function matchesLeaf(o,f){if(!f)return true;var fl=f.toLowerCase();return o.id.toLowerCase().indexOf(fl)!==-1||(o.name&&String(o.name).toLowerCase().indexOf(fl)!==-1);}
function computeAutoExpand(n,p,f,set){var any=false;for(var k in n.children){var c=n.children[k];var cp=p?p+'.'+k:k;var self=c.leaf&&matchesLeaf(c.leaf,f);var d=computeAutoExpand(c,cp,f,set);if(self||d){set.add(p);any=true;}}return any;}
function buildTreeHtml(n,p,depth,set,cur){var h='';var ks=Object.keys(n.children).sort();for(var i=0;i<ks.length;i++){var k=ks[i];var c=n.children[k];var cp=p?p+'.'+k:k;var br=Object.keys(c.children).length>0;
 if(c.leaf){var sel=cur&&c.leaf.id===cur;h+='<div class="tree-node'+(sel?' selected':'')+'" style="padding-left:'+(depth*16+10)+'px" onclick="selectObject(\''+esc(c.leaf.id).replace(/'/g,"\\'")+'\')"><span>• '+esc(c.leaf.name||k)+'<span class="tree-meta">'+nodeMeta(c.leaf)+'</span></span><span class="tree-id">'+esc(c.leaf.id)+'</span></div>';}
 if(br){var ex=set.has(cp);h+='<div class="tree-branch"><div class="tree-branch-header" style="padding-left:'+(depth*16+10)+'px" onclick="toggleBranchPath(\''+esc(cp).replace(/'/g,"\\'")+'\')"><span class="branch-toggle">'+(ex?'▼':'▶')+'</span><span class="branch-name">📁 '+esc(k)+'</span><span class="branch-count">('+countLeaves(c)+')</span>'+(c.leaf?'<span class="tree-meta">'+nodeMeta(c.leaf)+'</span>':'')+'</div>'+(ex?'<div>'+buildTreeHtml(c,cp,depth+1,set,cur)+'</div>':'')+'</div>';}}return h;}
function getTreeCurrentId(){if(!objectTreeContext)return null;if(objectTreeContext.target==='main')return gv('deviceId').trim();var r=document.querySelectorAll('.extra-id-input');if(r[objectTreeContext.extraIndex])return r[objectTreeContext.extraIndex].value.trim();return null;}
function renderObjectTree(){if(!ioBrokerTree)return;var f=gv('treeSearch');var cur=getTreeCurrentId();var set;if(f&&f.trim()){set=new Set();computeAutoExpand(ioBrokerTree,'',f,set);}else set=expandedPaths;var c=document.getElementById('objectTree');c.innerHTML=buildTreeHtml(ioBrokerTree,'',0,set,cur)||'<div class="tree-empty">Нет</div>';if(cur){var el=c.querySelector('.selected');if(el)setTimeout(()=>el.scrollIntoView({block:'center'}),50);}}
function toggleBranchPath(p){if(expandedPaths.has(p))expandedPaths.delete(p);else expandedPaths.add(p);renderObjectTree();}
function collectAllPaths(n,p,set){for(var k in n.children){var c=n.children[k];var cp=p?p+'.'+k:k;if(Object.keys(c.children).length>0){set.add(cp);collectAllPaths(c,cp,set);}}}
function expandAllBranches(){if(ioBrokerTree){collectAllPaths(ioBrokerTree,'',expandedPaths);renderObjectTree();}}
function collapseAllBranches(){expandedPaths.clear();renderObjectTree();}
function expandPathTo(id){var p=id.split('.');var a='';for(var i=0;i<p.length-1;i++){a=a?a+'.'+p[i]:p[i];expandedPaths.add(a);}}
function openObjectTree(t,i){objectTreeContext={target:t,extraIndex:i};document.getElementById('treeModal').classList.add('active');sv('treeSearch','');var cur=getTreeCurrentId();if(cur)expandPathTo(cur);else expandedPaths.clear();if(!allIoBrokerObjects)loadIoBrokerObjects();else renderObjectTree();}
function closeTreeModal(){document.getElementById('treeModal').classList.remove('active');objectTreeContext=null;}
function loadIoBrokerObjects(){fetch('/api/iobroker/objects').then(r=>r.json()).then(d=>{allIoBrokerObjects=d||[];ioBrokerTree=buildIoBrokerTree(allIoBrokerObjects);renderObjectTree();}).catch(()=>{});}
function filterTree(){renderObjectTree();}
function selectObject(id){if(!objectTreeContext)return;if(objectTreeContext.target==='main')sv('deviceId',id);else setExtraIdValue(objectTreeContext.extraIndex,id);closeTreeModal();}
