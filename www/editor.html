<title>Редактор v14</title><style>
:root{--p:#0061a4;--pc:#d1e4ff;--s:#e8ebf1;--s2:#eef1f6;--o:#73777f;--ov:#c3c7cf;--v:#43484e;--e:#ba1a1a;--ec:#f9dedc;--gap:8px;--pad:12px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Roboto,'Segoe UI',sans-serif;background:#f7f9fc;color:#1a1c20;padding:20px}
.container{max-width:1600px;margin:0 auto}.header{background:var(--pc);padding:16px 20px;border-radius:20px;margin-bottom:var(--gap);display:flex;gap:12px;align-items:center}.header h1{font-size:20px;flex:1}
#debugBanner{display:none;background:var(--ec);color:var(--e);padding:10px 16px;border-radius:10px;margin-bottom:12px}
.content{background:var(--s2);border-radius:20px;padding:20px}
.md-field{margin-bottom:var(--gap);display:flex;flex-direction:column;align-items:stretch}.md-field label{display:block;margin-bottom:4px;font-size:12px;color:var(--v);width:100%}
.md-field input,.md-field select{width:100%;padding:8px;border:1px solid var(--o);border-radius:6px;background:#fff;font-family:inherit;font-size:13px}
.md-field input[type=color]{height:36px;padding:2px}
.md-section{background:var(--s);border-radius:12px;padding:var(--pad);margin-bottom:var(--gap)}.md-section-title{font-size:13px;color:var(--p);font-weight:500;margin-bottom:8px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.color-grid{display:grid;gap:var(--gap);margin-top:4px}.color-item{display:flex;flex-direction:column;align-items:center;gap:2px}.color-item input[type=color]{width:100%;height:36px;border:1px solid var(--o);border-radius:6px;padding:2px}.color-item span{font-size:11px;color:var(--v)}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--v);margin-top:4px}
.chk input[type=checkbox]{margin:0;flex:0 0 auto}
.chk label{margin:0;flex:1}
.md-btn{border:none;border-radius:100px;padding:8px 16px;font-weight:500;cursor:pointer;font-family:inherit;font-size:13px}.md-btn.filled{background:var(--p);color:#fff}.md-btn.tonal{background:#d8e2ec;color:#101c26}.md-btn.text{background:none;color:var(--p)}.md-btn.danger{background:var(--ec);color:var(--e)}.md-btn.small{padding:6px 12px;font-size:12px}
.spacer{flex:1}
.ftc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:var(--gap);padding-bottom:var(--gap);border-bottom:1px solid var(--ov)}
.fte{padding:6px 10px;background:var(--s);border-radius:100px;cursor:pointer;font-size:12px;display:flex;gap:4px;align-items:center}.fte.active{background:var(--p);color:#fff}.fte button{border:none;background:rgba(0,0,0,.12);color:inherit;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:11px}
.fte .icon-btn{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.fw{display:flex;flex-direction:column;gap:var(--gap)}.ftb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:var(--s);border-radius:12px}.ftb input[type=text]{flex:1;min-width:140px;padding:8px;border:1px solid var(--o);border-radius:6px;font-size:13px}
.ls{display:flex;gap:4px;flex-wrap:wrap}.lc{padding:5px 10px;background:#fff;border:1px solid var(--ov);border-radius:100px;cursor:pointer;font-size:11px;display:flex;gap:4px;align-items:center}.lc.active{background:var(--p);color:#fff}.lc button{border:none;background:rgba(0,0,0,.12);color:inherit;border-radius:50%;width:16px;height:16px;cursor:pointer;font-size:10px}
.lc .icon-btn{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.pea{position:relative;width:100%;border-radius:12px;overflow:hidden;min-height:500px}.pea img{width:100%;display:block;user-select:none;pointer-events:none}.pempty{display:flex;align-items:center;justify-content:center;min-height:500px;color:var(--v)}
.marker{position:absolute;border-radius:50%;background:#fff;border:3px solid #2c3e50;display:flex;align-items:center;justify-content:center;cursor:move;user-select:none;z-index:10;transform:translate(-50%,-50%)}
.marker.selected{border-color:var(--p);box-shadow:0 0 0 3px var(--pc);z-index:15}
.marker .mi{line-height:1;pointer-events:none}
.marker .lock-icon{position:absolute;bottom:-2px;right:-2px;font-size:10px;background:#fff;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:22}
.im{display:inline-block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;pointer-events:none}
.lbl{position:absolute;pointer-events:none;white-space:nowrap;padding:2px 6px;border-radius:4px;z-index:21;font-size:11px}
.lp-b{top:100%;left:50%;transform:translate(-50%,4px)}.lp-t{bottom:100%;left:50%;transform:translate(-50%,-4px)}.lp-r{left:100%;top:50%;transform:translate(4px,-50%)}.lp-l{right:100%;top:50%;transform:translate(-4px,-50%)}.lp-o{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:max-content}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}.mo.active{display:flex}
.modal{background:var(--s);border-radius:20px;padding:20px;max-width:820px;width:92%;max-height:88vh;overflow-y:auto}.modal h2{margin-bottom:var(--gap);font-size:18px}
.ma{display:flex;gap:8px;align-items:center;margin-top:var(--gap);padding-top:var(--gap);border-top:1px solid var(--ov)}.ml{max-width:900px}
.sr{display:flex;align-items:center;gap:8px;margin-bottom:6px;background:#fff;border:1px solid var(--ov);border-radius:10px;padding:6px}.sr .sl{width:100px;font-size:12px;color:var(--v)}.sr .sp{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--s2);border-radius:50%;flex:0 0 36px;overflow:hidden}
.ots{display:flex;gap:6px;margin-bottom:var(--gap)}.ots input{flex:1;padding:8px;border:1px solid var(--o);border-radius:6px;font-size:13px}
.ot{border:1px solid var(--ov);border-radius:10px;max-height:450px;overflow-y:auto;background:#fff;font-size:12px}
.tbh{padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;user-select:none}.tbh:hover{background:var(--pc)}.bt{width:12px;color:var(--p);font-size:10px}.bn{font-weight:500;font-size:12px}.bc{color:var(--v);font-size:10px}.tm{color:var(--v);font-size:10px}
.tn{padding:4px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:12px}.tn:hover{background:var(--pc)}.tn.sel{background:var(--p);color:#fff}.tn .ti{font-family:Consolas,monospace;font-size:10px;color:var(--v);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn.sel .tm{color:rgba(255,255,255,.85)}
.tl{padding:20px;text-align:center;color:var(--v)}
.ip{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:400px;overflow-y:auto;border:1px solid var(--ov);border-radius:10px;padding:8px;background:#fff}
.io{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:4px;gap:2px}.io:hover{background:var(--pc)}.io .ipv{width:28px;height:28px;display:flex;align-items:center;justify-content:center}.io .in{font-size:8px;color:var(--v);word-break:break-all;max-height:18px;overflow:hidden;text-align:center}
.iw{display:flex;gap:6px}.iw input{flex:1}
.er{display:flex;gap:6px;margin-bottom:6px;align-items:center}.er input{flex:1;padding:6px;border:1px solid var(--o);border-radius:6px;font-size:12px}
.cm{position:fixed;z-index:3000;background:var(--s);border-radius:10px;min-width:170px;padding:4px;display:none}.cm.active{display:block}.ci{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px}.ci:hover{background:var(--pc)}.ci.d{color:var(--e)}
.picker-tabs{display:flex;gap:4px;margin-bottom:var(--gap);background:var(--s2);padding:4px;border-radius:100px}
.picker-tab{flex:1;padding:6px 12px;background:transparent;border:none;border-radius:100px;cursor:pointer;font-size:12px;font-weight:500;color:var(--v);font-family:inherit}
.picker-tab:hover{background:var(--s)}
.picker-tab.active{background:var(--p);color:#fff}
.picker-preview{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--ov);border-radius:10px;margin-bottom:var(--gap)}
.picker-preview .pv-box{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--s2);border-radius:10px;font-size:28px;overflow:hidden;flex:0 0 48px}
.picker-preview .pv-name{flex:1;font-size:12px;color:var(--v);word-break:break-all}
.picker-content{min-height:200px}
.picker-file-area{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;background:#fff;border:2px dashed var(--ov);border-radius:10px}
.align-panel{position:fixed;top:80px;right:20px;background:var(--s);border:1px solid var(--ov);border-radius:12px;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:500;display:none;flex-direction:column;gap:6px}
.align-panel.active{display:flex}
.align-panel-title{font-size:11px;font-weight:500;color:var(--v);text-align:center;margin-bottom:2px}
.align-panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.align-btn{width:36px;height:36px;border:1px solid var(--ov);border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s}
.align-btn:hover{background:var(--pc);border-color:var(--p)}
.align-btn:active{transform:scale(.95)}
.align-divider{height:1px;background:var(--ov);margin:2px 0}
.guide-zone{position:absolute;z-index:999;background:rgba(0,97,164,.05);transition:background .2s}
.guide-zone:hover{background:rgba(0,97,164,.15)}
.guide-zone.top{top:0;left:0;right:0;height:15px;cursor:ns-resize}
.guide-zone.bottom{bottom:0;left:0;right:0;height:15px;cursor:ns-resize}
.guide-zone.left{top:0;bottom:0;left:0;width:15px;cursor:ew-resize}
.guide-zone.right{top:0;bottom:0;right:0;width:15px;cursor:ew-resize}
.guide{position:absolute;z-index:50;pointer-events:auto}
.guide.horizontal{left:0;right:0;height:2px;background:#e74c3c;cursor:ns-resize}
.guide.vertical{top:0;bottom:0;width:2px;background:#e74c3c;cursor:ew-resize}
.guide:hover{background:#c0392b}
.guide.horizontal:hover{height:4px}
.guide.vertical:hover{width:4px}
.guide-label{position:absolute;background:#e74c3c;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;pointer-events:none;white-space:nowrap}
.guide.horizontal .guide-label{top:-20px;left:10px}
.guide.vertical .guide-label{left:10px;top:10px}
</style></head><body>
<div class="container"><div id="debugBanner"></div>

<div class="md-section"><div class="md-section-title">Шаблоны</div><div class="settings-grid">
