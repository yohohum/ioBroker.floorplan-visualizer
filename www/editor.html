<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230061a4"/><path d="M32 14 L50 30 V50 H38 V38 H26 V50 H14 V30 Z" fill="white"/></svg>'>
<title>Редактор v12</title><style>
:root{--p:#0061a4;--pc:#d1e4ff;--s:#e8ebf1;--s2:#eef1f6;--o:#73777f;--ov:#c3c7cf;--v:#43484e;--e:#ba1a1a;--ec:#f9dedc}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Roboto,'Segoe UI',sans-serif;background:#f7f9fc;color:#1a1c20;padding:20px}
.container{max-width:1600px;margin:0 auto}.header{background:var(--pc);padding:20px 26px;border-radius:24px;margin-bottom:16px;display:flex;gap:12px;align-items:center}.header h1{font-size:20px;flex:1}
#debugBanner{display:none;background:var(--ec);color:var(--e);padding:10px 16px;border-radius:10px;margin-bottom:12px}
.content{background:var(--s2);border-radius:24px;padding:24px}
.md-field{margin-bottom:12px}.md-field label{display:block;margin-bottom:5px;font-size:13px;color:var(--v)}
.md-field input,.md-field select{width:100%;padding:10px;border:1px solid var(--o);border-radius:8px;background:#fff;font-family:inherit}
.md-field input[type=color]{height:42px;padding:3px}
.md-section{background:var(--s);border-radius:16px;padding:14px;margin-bottom:14px}.md-section-title{font-size:14px;color:var(--p);font-weight:500;margin-bottom:10px}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.color-grid{display:grid;gap:8px;margin-top:6px}.color-item{display:flex;flex-direction:column;align-items:center;gap:4px}.color-item input[type=color]{width:100%;height:42px;border:1px solid var(--o);border-radius:8px;padding:3px}.color-item span{font-size:12px;color:var(--v)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--v);margin-top:6px}
.md-btn{border:none;border-radius:100px;padding:9px 20px;font-weight:500;cursor:pointer;font-family:inherit}.md-btn.filled{background:var(--p);color:#fff}.md-btn.tonal{background:#d8e2ec;color:#101c26}.md-btn.text{background:none;color:var(--p)}.md-btn.danger{background:var(--ec);color:var(--e)}.md-btn.small{padding:6px 14px;font-size:13px}
.spacer{flex:1}
.ftc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--ov)}
.fte{padding:8px 12px;background:var(--s);border-radius:100px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}.fte.active{background:var(--p);color:#fff}.fte button{border:none;background:rgba(0,0,0,.12);color:inherit;border-radius:50%;width:20px;height:20px;cursor:pointer}
.fw{display:flex;flex-direction:column;gap:14px}.ftb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--s);border-radius:16px}.ftb input[type=text]{flex:1;min-width:140px;padding:9px;border:1px solid var(--o);border-radius:8px}
.ls{display:flex;gap:6px;flex-wrap:wrap}.lc{padding:6px 12px;background:#fff;border:1px solid var(--ov);border-radius:100px;cursor:pointer;font-size:12px;display:flex;gap:6px;align-items:center}.lc.active{background:var(--p);color:#fff}.lc button{border:none;background:rgba(0,0,0,.12);color:inherit;border-radius:50%;width:18px;height:18px;cursor:pointer}
.pea{position:relative;width:100%;border-radius:16px;overflow:hidden;min-height:500px}.pea img{width:100%;display:block;user-select:none;pointer-events:none}.pempty{display:flex;align-items:center;justify-content:center;min-height:500px;color:var(--v)}
.marker{position:absolute;border-radius:50%;background:#fff;border:3px solid #2c3e50;display:flex;align-items:center;justify-content:center;cursor:move;user-select:none;z-index:10;transform:translate(-50%,-50%)}
.marker .mi{line-height:1;pointer-events:none}
.im{display:inline-block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;pointer-events:none}
.lbl{position:absolute;pointer-events:none;white-space:nowrap;padding:2px 8px;border-radius:6px;z-index:21}
.lp-b{top:100%;left:50%;transform:translate(-50%,4px)}.lp-t{bottom:100%;left:50%;transform:translate(-50%,-4px)}.lp-r{left:100%;top:50%;transform:translate(4px,-50%)}.lp-l{right:100%;top:50%;transform:translate(-4px,-50%)}.lp-o{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:max-content}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}.mo.active{display:flex}
.modal{background:var(--s);border-radius:24px;padding:22px;max-width:820px;width:92%;max-height:88vh;overflow-y:auto}.modal h2{margin-bottom:16px}
.ma{display:flex;gap:8px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--ov)}.ml{max-width:900px}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:8px;background:#fff;border:1px solid var(--ov);border-radius:12px;padding:8px}.sr .sl{width:110px;font-size:13px;color:var(--v)}.sr .sp{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--s2);border-radius:50%;flex:0 0 44px;overflow:hidden}
.ots{display:flex;gap:6px;margin-bottom:10px}.ots input{flex:1;padding:9px;border:1px solid var(--o);border-radius:8px}
.ot{border:1px solid var(--ov);border-radius:12px;max-height:450px;overflow-y:auto;background:#fff;font-size:13px}
.tbh{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;user-select:none}.tbh:hover{background:var(--pc)}.bt{width:14px;color:var(--p);font-size:10px}.bn{font-weight:500}.bc{color:var(--v);font-size:11px}.tm{color:var(--v);font-size:11px}
.tn{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.tn:hover{background:var(--pc)}.tn.sel{background:var(--p);color:#fff}.tn .ti{font-family:Consolas,monospace;font-size:11px;color:var(--v);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl,.te{padding:20px;text-align:center;color:var(--v)}
.ip{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;max-height:400px;overflow-y:auto;border:1px solid var(--ov);border-radius:12px;padding:10px;background:#fff}
.io{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;border-radius:10px;cursor:pointer;padding:5px;gap:4px}.io:hover{background:var(--pc)}.io .ipv{width:32px;height:32px;display:flex;align-items:center;justify-content:center}.io .in{font-size:9px;color:var(--v);word-break:break-all;max-height:22px;overflow:hidden;text-align:center}
.iw{display:flex;gap:6px}.iw input{flex:1}
.er{display:flex;gap:6px;margin-bottom:8px;align-items:center}.er input{flex:1;padding:8px;border:1px solid var(--o);border-radius:8px}
.cm{position:fixed;z-index:3000;background:var(--s);border-radius:12px;min-width:170px;padding:6px;display:none}.cm.active{display:block}.ci{padding:10px 16px;border-radius:8px;cursor:pointer}.ci:hover{background:var(--pc)}.ci.d{color:var(--e)}
</style></head><body>
<div class="container"><div id="debugBanner"></div>

<div class="md-field"><label>Применить</label><select id="templateSelect" onchange="applyTemplate(this.value)"><option value="">—</option></select></div>
<div class="md-field"><label>&nbsp;</label><button class="md-btn tonal" onclick="saveTemplate()">💾 Сохранить шаблон</button></div></div></div>
<div class="md-field"><label>Состояние ioBroker</label><div class="iw"><input id="deviceId"><button class="md-btn tonal small" onclick="openObjectTree('main',-1)">🔍</button></div></div>
<div class="md-field" id="thresholdFields" style="display:none"><div class="settings-grid"><div class="md-field"><label>Тревога мин</label><input type="number" id="warnBelow"></div><div class="md-field"><label>Тревога макс</label><input type="number" id="warnAbove"></div></div></div>
<div class="md-field"><label>Доп. состояния</label><div id="extraIdsContainer"></div><button class="md-btn tonal small" onclick="addExtraIdRow()">+ Добавить</button></div>
<div class="md-section"><div class="md-section-title">Иконка</div><div class="settings-grid"><div class="md-field"><label>Размер</label><input type="number" id="iconSize"></div><div class="md-field"><label>Прозрачность</label><input type="number" id="iconOpacity" step="0.1" min="0" max="1"></div></div>
<div id="iconSlots"></div><div class="md-field"><label>Фон</label><div class="color-grid" id="colBg"></div></div><div class="md-field"><label>Цвет иконки</label><div class="color-grid" id="colIc"></div></div><div class="md-field"><label>Рамка</label><div class="color-grid" id="colBd"></div></div></div>
<div class="md-section"><div class="md-section-title">Шрифт значения</div><label class="chk"><input type="checkbox" id="vf-show" checked>Выводить значение</label>
<div class="settings-grid"><div class="md-field"><label>Шрифт</label><select id="vf-family"></select></div><div class="md-field"><label>Начертание</label><select id="vf-weight"></select></div><div class="md-field"><label>Размер</label><input id="vf-size"></div><div class="md-field"><label>Цвет</label><input type="color" id="vf-color"></div><div class="md-field"><label>Фон</label><input type="color" id="vf-bg"></div><div class="md-field"><label>Позиция</label><select id="vf-position"><option value="bottom">Снизу</option><option value="top">Сверху</option><option value="right">Справа</option><option value="left">Слева</option><option value="overlay">Поверх</option></select></div></div>
<label class="chk"><input type="checkbox" id="vf-nobg">Фон прозрачный</label>
<div class="settings-grid"><div class="md-field"><label>Префиксы</label><input id="devicePrefixes"></div><div class="md-field"><label>Постфиксы</label><input id="devicePostfixes"></div></div></div>
<div class="md-section"><div class="md-section-title">Шрифт названия</div><label class="chk"><input type="checkbox" id="nf-show" checked>Выводить название</label>
<div class="settings-grid"><div class="md-field"><label>Шрифт</label><select id="nf-family"></select></div><div class="md-field"><label>Начертание</label><select id="nf-weight"></select></div><div class="md-field"><label>Размер</label><input id="nf-size"></div><div class="md-field"><label>Цвет</label><input type="color" id="nf-color"></div><div class="md-field"><label>Фон</label><input type="color" id="nf-bg"></div><div class="md-field"><label>Позиция</label><select id="nf-position"><option value="bottom">Снизу</option><option value="top">Сверху</option><option value="right">Справа</option><option value="left">Слева</option><option value="overlay">Поверх</option></select></div></div>
<label class="chk"><input type="checkbox" id="nf-nobg">Фон прозрачный</label></div>
<div class="ma"><button class="md-btn danger" id="btnDel" onclick="deleteDevice()">Удалить</button><span class="spacer"></span><button class="md-btn text" onclick="cancelDevice()">Отменить</button><button class="md-btn filled" onclick="saveDevice()">Сохранить</button></div></div></div>

<div class="mo" id="settingsModal"><div class="modal"><h2>Настройки</h2>
<div class="md-section"><div class="md-section-title">План</div><div class="settings-grid"><div class="md-field"><label>Фон плана</label><input type="color" id="planBg"></div></div></div>
<div class="md-field"><label>Панель</label><select id="barTarget" onchange="fillBarFields()"><option value="floor">Этажи</option><option value="layer">Слои</option></select></div>
<div class="settings-grid"><div class="md-field"><label>Высота</label><input type="number" id="bar-height"></div><div class="md-field"><label>Длина</label><input type="number" id="bar-width"></div><div class="md-field"><label>Отступ</label><input type="number" id="bar-gap"></div><div class="md-field"><label>Радиус</label><input type="number" id="bar-radius"></div><div class="md-field"><label>Ориентация</label><select id="bar-orient"><option value="h">Гориз.</option><option value="v">Верт.</option></select></div><div class="md-field"><label>Позиция</label><select id="bar-position"><option value="top">Сверху</option><option value="bottom">Снизу</option><option value="left">Слева</option><option value="right">Справа</option></select></div><div class="md-field"><label>Выравнивание</label><select id="bar-align"><option value="center">Центр</option><option value="left">Лево</option><option value="right">Право</option></select></div></div>
<div class="md-section"><div class="md-section-title">Иконка кнопки</div><div class="settings-grid"><div class="md-field"><label>Иконка</label><div style="display:flex;gap:6px;align-items:center"><button class="md-btn tonal small" onclick="openBarDisk()">📁</button><button class="md-btn tonal small" onclick="openBarMfd()">MFD</button><button class="md-btn danger small" onclick="clearBarIcon()">✕</button><span id="barIconPreview" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center"></span></div></div><div class="md-field"><label>Место</label><select id="bar-iconpos"><option value="left">Слева</option><option value="right">Справа</option></select></div></div></div>
<div class="md-section"><div class="md-section-title">Активная</div><div class="settings-grid"><div class="md-field"><label>Фон</label><input type="color" id="bar-a-bg"></div><div class="md-field"><label>Рамка</label><input type="color" id="bar-a-bd"></div><div class="md-field"><label>Шрифт</label><select id="bar-a-ff"></select></div><div class="md-field"><label>Начерт.</label><select id="bar-a-fw"></select></div><div class="md-field"><label>Размер</label><input id="bar-a-fs"></div><div class="md-field"><label>Цвет</label><input type="color" id="bar-a-fc"></div></div></div>
<div class="md-section"><div class="md-section-title">Неактивная</div><div class="settings-grid"><div class="md-field"><label>Фон</label><input type="color" id="bar-i-bg"></div><div class="md-field"><label>Рамка</label><input type="color" id="bar-i-bd"></div><div class="md-field"><label>Шрифт</label><select id="bar-i-ff"></select></div><div class="md-field"><label>Начерт.</label><select id="bar-i-fw"></select></div><div class="md-field"><label>Размер</label><input id="bar-i-fs"></div><div class="md-field"><label>Цвет</label><input type="color" id="bar-i-fc"></div></div></div>
<div class="ma"><span class="spacer"></span><button class="md-btn text" onclick="closeSettingsModal()">Закрыть</button><button class="md-btn filled" onclick="saveSettingsModal()">Сохранить</button></div></div></div>

<div class="mo" id="treeModal"><div class="modal ml"><h2>Объект ioBroker</h2><div class="ots"><input id="treeSearch" oninput="filterTree()"><button class="md-btn tonal small" onclick="expandAllBranches()">+</button><button class="md-btn tonal small" onclick="collapseAllBranches()">−</button></div><div class="ot" id="objectTree"><div class="tl">Загрузка</div></div><div class="ma"><span class="spacer"></span><button class="md-btn text" onclick="closeTreeModal()">Закрыть</button></div></div></div>
<div class="mo" id="emojiModal"><div class="modal"><h2>Emoji</h2><div class="ip" id="emojiPalette"></div><div class="ma"><span class="spacer"></span><button class="md-btn text" onclick="closeEmojiModal()">Закрыть</button></div></div></div>
<div class="mo" id="mfdModal"><div class="modal ml"><h2>MFD</h2><div class="ots"><input id="mfdSearch" oninput="filterMfdPalette()"></div><div class="ip" id="mfdPalette"><div class="tl">Загрузка</div></div><div class="ma"><span class="spacer"></span><button class="md-btn text" onclick="closeMfdModal()">Закрыть</button></div></div></div>

<script>
'use strict';
var config=null,currentFloorId=null,currentLayerId=null,liveStates={};
var allIoBrokerObjects=null,ioBrokerTree=null,expandedPaths=new Set(),objectTreeContext=null;
var allMfdIcons=null,mfdBaseUrl='/icons-mfd-png/';
var editingDevice=null,editingLayerRef=null,editingIsNew=false,slotTarget=null,liveTimer=null,barIcon=null;
var CACHE_BUSTER='?v='+Date.now();var PRES_PORT=8084;
var DEF_VF={family:'Arial',weight:'400',size:'12px',color:'#fff',bgColor:'transparent',position:'overlay'};
var DEF_NF={family:'Arial',weight:'400',size:'12px',color:'#fff',bgColor:'transparent',position:'bottom'};
var FONTS=['Arial','Arial Black','Verdana','Tahoma','Trebuchet MS','Segoe UI','Roboto','Open Sans','Lato','Montserrat','Times New Roman','Georgia','Garamond','Courier New','Lucida Console','Impact','Comic Sans MS'];
var WEIGHTS=[['300','Light (300)'],['400','Regular (400)'],['500','Medium (500)'],['600','SemiBold (600)'],['700','Bold (700)']];
var emojiGroups={'Освещение':['💡','🔆','💫','🕯️','✨'],'Розетки':['🔌','','🔋'],'Климат':['🌡️','️'],'Безопасность':['🔒','📹'],'Мультимедиа':['🔊']};
function showDebug(m){var b=document.getElementById('debugBanner');if(b){b.style.display='block';b.textContent=m;}}
window.addEventListener('error',function(e){showDebug('JS: '+e.message+' ('+e.lineno+')');});
function esc(s){return(s==null)?'':String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function splitKeep(v){v=String(v==null?'':v);if(v==='')return[];return v.split(',');}
function gv(id){return document.getElementById(id).value;}
function sv(id,v){document.getElementById(id).value=v;}
function ensureConfig(){if(!config||typeof config!=='object')config={};if(!Array.isArray(config.floors))config.floors=[];if(!Array.isArray(config.templates))config.templates=[];}
function normalizeType(t){if(t==='value_read'||t==='value_write'||t==='value')return'value';if(t==='list')return'switch';return t||'switch';}
function isValue(t){return t==='value';}
function iconStates(){return isValue(gv('deviceObjType'))?[{k:'min',l:'Тревога мин'},{k:'norm',l:'Норма'},{k:'max',l:'Тревога макс'}]:[{k:'on',l:'Вкл'},{k:'off',l:'Выкл'}];}
function defColor(k){return{on:'#0cbaba',off:'#7f8c8d',min:'#e74c3c',norm:'#2ecc71',max:'#e74c3c'}[k]||'#000';}
function getStateKey(dev,v){if(isValue(dev.objType)){var n=parseFloat(v);if(!isNaN(n)){if(dev.warnBelow!==''&&dev.warnBelow!=null&&n<+dev.warnBelow)return'min';if(dev.warnAbove!==''&&dev.warnAbove!=null&&n>+dev.warnAbove)return'max';}return'norm';}return v?'on':'off';}
function defaultSlots(t){return isValue(t)?{min:{kind:'emoji',value:'⚠️'},norm:{kind:'emoji',value:'🟢'},max:{kind:'emoji',value:'🔺'}}:{on:{kind:'emoji',value:'💡'},off:{kind:'emoji',value:'🌑'}};}
function defaultIcon(t){var keys=isValue(t)?['min','norm','max']:['on','off'];var bg={},co={},bd={};keys.forEach(function(k){bg[k]='#fff';co[k]=defColor(k);bd[k]=defColor(k);});return{size:48,opacity:1,bg:bg,color:co,border:bd,slots:defaultSlots(t)};}
function applyFont(el,f){el.style.fontFamily=f.family;el.style.fontWeight=f.weight;el.style.fontSize=f.size;el.style.color=f.color;if(f.bgColor&&f.bgColor!=='transparent')el.style.backgroundColor=f.bgColor;}
function fillFont(el,cur){cur=cur||'Arial';el.innerHTML='';var found=false;FONTS.forEach(function(f){var o=document.createElement('option');o.value=f;o.textContent=f;if(f===cur){o.selected=true;found=true;}el.appendChild(o);});if(!found){var o=document.createElement('option');o.value=cur;o.textContent=cur;o.selected=true;el.appendChild(o);}}
function fillWeight(el,cur){cur=String(cur||'400');if(cur==='normal')cur='400';if(cur==='bold')cur='700';el.innerHTML='';WEIGHTS.forEach(function(w){var o=document.createElement('option');o.value=w[0];o.textContent=w[1];if(w[0]===cur)o.selected=true;el.appendChild(o);});}
function barDefaults(){return{height:40,width:120,gap:8,radius:100,orient:'h',position:'top',align:'center',icon:null,iconPos:'left',active:{bg:'#0cbaba',border:'#0cbaba',font:{family:'Roboto',weight:'500',size:'14px',color:'#ffffff'}},inactive:{bg:'#2a2f36',border:'#3a4048',font:{family:'Roboto',weight:'500',size:'14px',color:'#e8eaed'}}};}
document.addEventListener('DOMContentLoaded',loadConfig);
function loadConfig(){fetch('/api/config').then(function(r){return r.json();}).then(function(d){config=d;ensureConfig();if(!currentFloorId&&config.floors[0])currentFloorId=config.floors[0].id;renderFloorWorkspace();}).catch(function(e){ensureConfig();renderFloorWorkspace();showDebug('Ошибка: '+e.message);});}
function saveConfig(cb){fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}).then(function(){if(cb)cb();}).catch(function(){showDebug('Ошибка сохранения');});}
function moveFloor(i,dir){var a=config.floors;var j=i+dir;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;saveConfig(renderFloorWorkspace);}
function moveLayer(fIdx,i,dir){var a=config.floors[fIdx].layers;var j=i+dir;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;saveConfig(renderFloorWorkspace);}
function openPreview(fId){window.open('http://'+location.hostname+':'+PRES_PORT+'/?floor='+fId,'_blank');}
function renderFloorTabs(){var c=document.getElementById('fte');var h='';for(var i=0;i<config.floors.length;i++){var f=config.floors[i];h+='<div class="fte'+(f.id===currentFloorId?' active':'')+'" onclick="selectFloor(\''+f.id+'\')"><span>'+esc(f.name)+'</span><button onclick="event.stopPropagation();moveFloor('+i+',-1)">↑</button><button onclick="event.stopPropagation();moveFloor('+i+',1)">↓</button><button onclick="event.stopPropagation();removeFloor('+i+',event)">×</button></div>';}
h+='<button class="md-btn filled small" onclick="addFloor()">+ Этаж</button><span class="spacer"></span>'+(currentFloorId?'<button class="md-btn tonal small" onclick="openPreview(\''+currentFloorId+'\')">👁 Просмотр</button>':'');c.innerHTML=h;}
function addFloor(){ensureConfig();var id='floor_'+Date.now();config.floors.push({id:id,name:'Новый этаж',image:'',layers:[]});currentFloorId=id;currentLayerId=null;saveConfig(renderFloorWorkspace);}
function removeFloor(i,e){if(e)e.stopPropagation();if(!confirm('Удалить этаж?'))return;var rid=config.floors[i].id;config.floors.splice(i,1);if(currentFloorId===rid)currentFloorId=config.floors[0]?config.floors[0].id:null;saveConfig(renderFloorWorkspace);}
function selectFloor(id){currentFloorId=id;currentLayerId=null;renderFloorWorkspace();}
function getCurrentFloor(){for(var i=0;i<config.floors.length;i++)if(config.floors[i].id===currentFloorId)return{floor:config.floors[i],idx:i};return null;}
function planBg(){return(config&&config.planBg)||'#2a2f36';}
function renderFloorWorkspace(){renderFloorTabs();var w=document.getElementById('fw');var cur=getCurrentFloor();if(!cur){w.innerHTML='<div class="pempty" style="background:'+planBg()+'">🏠 Добавьте этаж</div>';stopLive();return;}
var floor=cur.floor,fIdx=cur.idx;
if(!currentLayerId||!floor.layers.some(function(l){return l.id===currentLayerId;}))currentLayerId=floor.layers[0]?floor.layers[0].id:null;
var chips='';floor.layers.forEach(function(l,i){chips+='<div class="lc'+(l.id===currentLayerId?' active':'')+'" onclick="selectLayer(\''+l.id+'\')"><span>'+esc(l.name)+'</span><button onclick="event.stopPropagation();moveLayer('+fIdx+','+i+',-1)">↑</button><button onclick="event.stopPropagation();moveLayer('+fIdx+','+i+',1)">↓</button><button onclick="event.stopPropagation();removeLayer('+fIdx+',\''+l.id+'\',event)">×</button></div>';});
var h='<div class="ftb"><input type="text" value="'+esc(floor.name)+'" id="floorNameInput"><button class="md-btn filled small" onclick="saveFloorName('+fIdx+')">💾</button><button class="md-btn tonal small" onclick="document.getElementById(\'floorImageInput\').click()">🖼️</button><input type="file" id="floorImageInput" accept="image/*" style="display:none" onchange="handleImageUpload(this,'+fIdx+')"></div>';
h+='<div class="ftb"><strong>Слои:</strong><div class="ls">'+chips+'<button class="md-btn tonal small" onclick="addLayer('+fIdx+')">+ Слой</button></div><span class="spacer"></span><button class="md-btn filled small" onclick="openAddDeviceModal('+fIdx+')">+ Объект</button></div>';
if(floor.image)h+='<div class="pea" id="pea" style="background:'+planBg()+'"><img src="'+floor.image+CACHE_BUSTER+'" id="peaImg"></div>';
else h+='<div class="pea" style="background:'+planBg()+'"><div class="pempty">🖼️ Загрузите план</div></div>';
w.innerHTML=h;if(floor.image){renderPlanMarkers(floor,fIdx);startLive();}else stopLive();}
function selectLayer(id){currentLayerId=id;renderFloorWorkspace();}
function addLayer(fIdx){var n=prompt('Название слоя:','Новый слой');if(!n)return;var f=config.floors[fIdx];if(!f.layers)f.layers=[];var nl={id:'layer_'+Date.now(),name:n,devices:[]};f.layers.push(nl);currentLayerId=nl.id;saveConfig(renderFloorWorkspace);}
function removeLayer(fIdx,lId,e){if(e)e.stopPropagation();if(!confirm('Удалить слой?'))return;var f=config.floors[fIdx];var i=f.layers.findIndex(function(l){return l.id===lId;});if(i>=0)f.layers.splice(i,1);if(currentLayerId===lId)currentLayerId=null;saveConfig(renderFloorWorkspace);}
function saveFloorName(fIdx){config.floors[fIdx].name=gv('floorNameInput')||'Без названия';saveConfig(renderFloorTabs);}
function handleImageUpload(inp,fIdx){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:'floor_'+fIdx+'_'+Date.now()+'.png',base64Data:e.target.result})}).then(function(x){return x.json();}).then(function(d){if(d.success){config.floors[fIdx].image=d.url;saveConfig(renderFloorWorkspace);}});};r.readAsDataURL(f);}
function openSettingsModal(){sv('planBg',config.planBg||'#2a2f36');fillBarFields();document.getElementById('settingsModal').classList.add('active');}
function closeSettingsModal(){document.getElementById('settingsModal').classList.remove('active');}
function getBar(t){return(t==='floor'?config.floorBar:config.layerBar)||barDefaults();}
function barIconHtml(icon,h){if(!icon)return'';if(icon.kind==='emoji')return'<span style="font-size:'+h+';line-height:1">'+esc(icon.value)+'</span>';var u=icon.kind==='mfd'?(mfdBaseUrl+icon.value+'.png'):icon.value;return'<span class="im" style="width:'+h+';height:'+h+';background-color:currentColor;-webkit-mask-image:url('+u+');mask-image:url('+u+');"></span>';}
function updateBarIconPreview(){document.getElementById('barIconPreview').innerHTML=barIcon?barIconHtml(barIcon,'28px'):'';}
function openBarDisk(){slotTarget='__bar';document.getElementById('barIconInput').click();}
function openBarMfd(){slotTarget='__bar';openMfdPalette();}
function clearBarIcon(){barIcon=null;updateBarIconPreview();}
function fillBarFields(){var s=getBar(gv('barTarget'));sv('bar-height',s.height);sv('bar-width',s.width);sv('bar-gap',s.gap);sv('bar-radius',s.radius);sv('bar-orient',s.orient);sv('bar-position',s.position);sv('bar-align',s.align);sv('bar-iconpos',s.iconPos||'left');
barIcon=s.icon||null;updateBarIconPreview();
fillFont(document.getElementById('bar-a-ff'),s.active.font.family);fillWeight(document.getElementById('bar-a-fw'),s.active.font.weight);
fillFont(document.getElementById('bar-i-ff'),s.inactive.font.family);fillWeight(document.getElementById('bar-i-fw'),s.inactive.font.weight);
sv('bar-a-bg',s.active.bg);sv('bar-a-bd',s.active.border);sv('bar-a-fs',s.active.font.size);sv('bar-a-fc',s.active.font.color);
sv('bar-i-bg',s.inactive.bg);sv('bar-i-bd',s.inactive.border);sv('bar-i-fs',s.inactive.font.size);sv('bar-i-fc',s.inactive.font.color);}
function saveSettingsModal(){config.planBg=gv('planBg');var t=gv('barTarget');var s={height:+gv('bar-height'),width:+gv('bar-width'),gap:+gv('bar-gap'),radius:+gv('bar-radius'),orient:gv('bar-orient'),position:gv('bar-position'),align:gv('bar-align'),icon:barIcon,iconPos:gv('bar-iconpos'),
active:{bg:gv('bar-a-bg'),border:gv('bar-a-bd'),font:{family:gv('bar-a-ff'),weight:gv('bar-a-fw'),size:gv('bar-a-fs'),color:gv('bar-a-fc')}},
inactive:{bg:gv('bar-i-bg'),border:gv('bar-i-bd'),font:{family:gv('bar-i-ff'),weight:gv('bar-i-fw'),size:gv('bar-i-fs'),color:gv('bar-i-fc')}}};
if(t==='floor')config.floorBar=s;else config.layerBar=s;closeSettingsModal();saveConfig(renderFloorWorkspace);}
function collectStates(){var ids=[];var cur=getCurrentFloor();if(!cur)return ids;(cur.floor.layers||[]).forEach(function(l){(l.devices||[]).forEach(function(d){(d.stateIds||[]).forEach(function(s){if(s&&ids.indexOf(s)<0)ids.push(s);});});});return ids;}
function startLive(){stopLive();pollLive();liveTimer=setInterval(pollLive,2000);}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null;}}
function pollLive(){collectStates().forEach(function(sid){fetch('/api/state/'+sid).then(function(r){return r.json();}).then(function(d){if(d&&liveStates[sid]!==d.val){liveStates[sid]=d.val;refreshMarkers();}}).catch(function(){});});}
function refreshMarkers(){var cur=getCurrentFloor();if(cur&&cur.floor.image)renderPlanMarkers(cur.floor,cur.idx);}
function slotHtml(slot,color){if(!slot)return'<span class="mi">•</span>';if(slot.kind==='emoji')return'<span class="mi">'+esc(slot.value)+'</span>';var u=slot.kind==='mfd'?(mfdBaseUrl+slot.value+'.png'):slot.value;return'<span class="im" style="width:100%;height:100%;background-color:'+color+';-webkit-mask-image:url('+u+');mask-image:url('+u+');"></span>';}
function previewSlot(slot){if(!slot)return'•';if(slot.kind==='emoji')return'<span style="font-size:22px">'+esc(slot.value)+'</span>';var u=slot.kind==='mfd'?(mfdBaseUrl+slot.value+'.png'):slot.value;return'<span class="im" style="width:28px;height:28px;background-color:#000;-webkit-mask-image:url('+u+');mask-image:url('+u+');"></span>';}
function buildMarker(dev,stateVal){var ic=dev.icon||defaultIcon(dev.objType);var key=getStateKey(dev,stateVal);
var m=document.createElement('div');m.className='marker';m.style.left=(dev.x||50)+'%';m.style.top=(dev.y||50)+'%';m.style.width=(ic.size||48)+'px';m.style.height=(ic.size||48)+'px';m.style.opacity=ic.opacity!=null?ic.opacity:1;
m.style.backgroundColor=(ic.bg&&ic.bg[key])||'#fff';m.style.borderColor=(ic.border&&ic.border[key])||defColor(key);
if(stateVal)m.style.boxShadow='0 0 15px '+((ic.border&&ic.border[key])||defColor(key));
m.innerHTML=slotHtml((ic.slots||{})[key],(ic.color&&ic.color[key])||defColor(key));
if(dev.showValue!==false&&dev.stateIds&&dev.stateIds.length){var vd=document.createElement('span');vd.className='lbl lp-'+({bottom:'b',top:'t',right:'r',left:'l',overlay:'o'}[(dev.valueFont&&dev.valueFont.position)||'overlay']);applyFont(vd,dev.valueFont||DEF_VF);
dev.stateIds.forEach(function(sid,idx){var val=liveStates[sid];var pr=(dev.prefixes&&dev.prefixes[idx]!=null)?dev.prefixes[idx]:'';var po=(dev.postfixes&&dev.postfixes[idx]!=null)?dev.postfixes[idx]:'';var ln=document.createElement('span');ln.style.display='block';ln.textContent=pr+((val!==undefined&&val!==null)?val:'N/A')+po;vd.appendChild(ln);});m.appendChild(vd);}
if(dev.showName!==false){var nm=document.createElement('span');nm.className='lbl lp-'+({bottom:'b',top:'t',right:'r',left:'l',overlay:'o'}[(dev.nameFont&&dev.nameFont.position)||'bottom']);nm.textContent=dev.name||'';applyFont(nm,dev.nameFont||DEF_NF);m.appendChild(nm);}
return m;}
var ctxMenuEl=null;function hideCtxMenu(){if(ctxMenuEl)ctxMenuEl.classList.remove('active');}
function showCtxMenu(x,y,items){if(!ctxMenuEl){ctxMenuEl=document.createElement('div');ctxMenuEl.className='cm';document.body.appendChild(ctxMenuEl);document.addEventListener('click',hideCtxMenu);}ctxMenuEl.innerHTML='';items.forEach(function(it){var d=document.createElement('div');d.className='ci'+(it.danger?' d':'');d.textContent=it.label;d.onclick=function(e){e.stopPropagation();hideCtxMenu();it.action();};ctxMenuEl.appendChild(d);});ctxMenuEl.style.left=Math.min(x,innerWidth-190)+'px';ctxMenuEl.style.top=Math.min(y,innerHeight-140)+'px';ctxMenuEl.classList.add('active');}
function renderPlanMarkers(floor,fIdx){var area=document.getElementById('pea');if(!area)return;area.querySelectorAll('.marker').forEach(function(m){m.remove();});if(!currentLayerId)return;
var layer=null,lIdx=-1;for(var i=0;i<floor.layers.length;i++)if(floor.layers[i].id===currentLayerId){layer=floor.layers[i];lIdx=i;break;}if(!layer)return;
(layer.devices||[]).forEach(function(dev){var m=buildMarker(dev,liveStates[dev.stateIds&&dev.stateIds[0]]);
attachDrag(m,dev);
m.addEventListener('dblclick',function(e){e.preventDefault();openEditDeviceModal(fIdx,lIdx,dev.id);});
m.addEventListener('contextmenu',function(e){e.preventDefault();showCtxMenu(e.clientX,e.clientY,[{label:'✏️ Редактировать',action:function(){openEditDeviceModal(fIdx,lIdx,dev.id);}},{label:'⧉ Копировать',action:function(){copyDevice(fIdx,lIdx,dev.id);}},{label:'🗑 Удалить',danger:true
