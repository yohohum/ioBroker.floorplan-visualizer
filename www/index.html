<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230061a4"/><path d="M32 14 L50 30 V50 H38 V38 H26 V50 H14 V30 Z" fill="white"/></svg>'>
<title>План умного дома</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto','Segoe UI',system-ui,sans-serif;background:#14161a;color:#e8eaed;padding:20px}
.wrapper{max-width:1400px;margin:0 auto;background:#1f2329;border-radius:28px;padding:20px}
.plan-container{position:relative;width:100%;border-radius:16px;overflow:hidden;min-height:500px}
.plan-image{width:100%;height:auto;display:block;user-select:none}
.bar{position:absolute;z-index:60;display:flex}
.bar button{cursor:pointer;border:2px solid;display:flex;align-items:center;justify-content:center;gap:6px}
.bar button .bicon{display:inline-flex;align-items:center;justify-content:center}
.marker{position:absolute;border-radius:50%;background:#fff;border:3px solid #2c3e50;display:flex;align-items:center;justify-content:center;user-select:none;z-index:10;transform:translate(-50%,-50%)}
.marker.clickable{cursor:pointer}
.marker.clickable:hover{transform:translate(-50%,-50%) scale(1.12);z-index:100}
.marker .marker-icon{line-height:1;pointer-events:none}
.icon-mask{display:inline-block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;pointer-events:none}
.lbl{position:absolute;pointer-events:none;white-space:nowrap;padding:2px 8px;border-radius:6px;z-index:21}
.lbl-pos-bottom{top:100%;left:50%;transform:translate(-50%,4px)}
.lbl-pos-top{bottom:100%;left:50%;transform:translate(-50%,-4px)}
.lbl-pos-right{left:100%;top:50%;transform:translate(4px,-50%)}
.lbl-pos-left{right:100%;top:50%;transform:translate(-4px,-50%)}
.lbl-pos-overlay{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:max-content}
.loading{display:flex;align-items:center;justify-content:center;min-height:400px;color:#9aa0a6}
</style>
</head>
<body>
<div class="wrapper"><div class="plan-container" id="planContainer"><div class="loading">Загрузка...</div></div></div>
