<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%230061a4"/><path d="M32 14 L50 30 V50 H38 V38 H26 V50 H14 V30 Z" fill="white"/></svg>'>
<title>План умного дома</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:Roboto,'Segoe UI',sans-serif;background:#14161a;color:#e8eaed}
.plan-container{position:absolute;inset:0;overflow:auto}
.plan-inner{position:absolute;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.plan-content{position:absolute}
.plan-content img{display:block;user-select:none;width:100%;height:100%}
.bar{position:absolute;z-index:60;display:flex}
.bar button{cursor:pointer;border:2px solid;display:flex;align-items:center;gap:6px;padding:0 12px;min-width:0;box-sizing:border-box}
.bar button .bicon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar button .btext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marker{position:absolute;border-radius:50%;background:#fff;border:3px solid #2c3e50;display:flex;align-items:center;justify-content:center;user-select:none;z-index:10;transform:translate(-50%,-50%)}
.marker.clickable{cursor:pointer}
.marker.clickable:hover{transform:translate(-50%,-50%) scale(1.12);z-index:100}
.marker .mi{line-height:1;pointer-events:none}
.marker .lock-icon{position:absolute;bottom:-2px;right:-2px;font-size:12px;background:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:22}
.im{display:inline-block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;pointer-events:none}
.lbl{position:absolute;pointer-events:none;white-space:nowrap;padding:2px 8px;border-radius:6px;z-index:21}
.lp-b{top:100%;left:50%;transform:translate(-50%,4px)}
.lp-t{bottom:100%;left:50%;transform:translate(-50%,-4px)}
.lp-r{left:100%;top:50%;transform:translate(4px,-50%)}
.lp-l{right:100%;top:50%;transform:translate(-4px,-50%)}
.lp-o{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:max-content}
.loading{display:flex;align-items:center;justify-content:center;min-height:400px;color:#9aa0a6;position:absolute;inset:0}
</style></head><body>
<div class="plan-container" id="planContainer"><div class="loading">Загрузка...</div></div>
<script>
'use strict';
var config=null,currentFloorId=null,currentLayerId=null,deviceStates={},lastConfigJson='';
var urlParams=new URLSearchParams(location.search);var requestedFloorId=urlParams.get('floor');
var DEF_VF={family:'Arial',weight:'400',size:'12px',color:'#fff',bgColor:'transparent',position:'overlay'};
var DEF_NF={family:'Arial',weight:'400',size:'12px',color:'#fff',bgColor:'transparent',position:'bottom'};
function esc(s){return(s==null)?'':String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function normalizeType(t){if(t==='value_read'||t==='value_write'||t==='value')return'value';if(t==='list')return'switch';return t||'switch';}
function isValue(t){return t==='value';}
function defColor(k){return{on:'#0cbaba',off:'#7f8c8d',min:'#e74c3c',norm:'#2ecc71',max:'#e74c3c'}[k]||'#000';}
function getStateKey(dev,v){if(isValue(dev.objType)){var n=parseFloat(v);if(!isNaN(n)){if(dev.warnBelow!==''&&dev.warnBelow!=null&&n<+dev.warnBelow)return'min';if(dev.warnAbove!==''&&dev.warnAbove!=null&&n>+dev.warnAbove)return'max';}return'norm';}return v?'on':'off';}
function defaultIcon(t){var keys=isValue(t)?['min','norm','max']:['on','off'];var bg={},co={},bd={};keys.forEach(function(k){bg[k]='#fff';co[k]=defColor(k);bd[k]=defColor(k);});return{size:48,opacity:1,bg:bg,color:co,border:bd,slots:isValue(t)?{min:{kind:'emoji',value:'⚠️'},norm:{kind:'emoji',value:'🟢'},max:{kind:'emoji',value:'🔺'}}:{on:{kind:'emoji',value:'💡'},off:{kind:'emoji',value:'🌑'}}};}
function applyFont(el,f){el.style.fontFamily=f.family;el.style.fontWeight=f.weight;el.style.fontSize=f.size;el.style.color=f.color;if(f.bgColor&&f.bgColor!=='transparent')el.style.backgroundColor=f.bgColor;}
function slotHtml(slot,color){if(!slot)return'<span class="mi">•</span>';if(slot.kind==='emoji')return'<span class="mi">'+esc(slot.value)+'</span>';var u=slot.kind==='mfd'?('/icons-mfd-png/'+slot.value+'.png'):slot.value;return'<span class="im" style="width:100%;height:100%;background-color:'+color+';-webkit-mask-image:url('+u+');mask-image:url('+u+');"></span>';}
function barDefaults(){return{height:40,width:120,gap:8,radius:100,orient:'h',position:'top',align:'center',textAlign:'left',icon:null,iconPos:'left',active:{bg:'#0cbaba',border:'#0cbaba',font:{family:'Roboto',weight:'500',size:'14px',color:'#ffffff'}},inactive:{bg:'#2a2f36',border:'#3a4048',font:{family:'Roboto',weight:'500',size:'14px',color:'#e8eaed'}}};}
function styleBar(el,s){
el.style.flexDirection=s.orient==='v'?'column':'row';
el.style.gap=s.gap+'px';
el.style.top=el.style.bottom=el.style.left=el.style.right='auto';
el.style.transform='none';
if(s.position==='top'){
el.style.top='8px';
if(s.align==='center'){el.style.left='50%';el.style.transform='translateX(-50%)';}
else if(s.align==='left'){el.style.left='8px';}
else{el.style.right='8px';}
}else if(s.position==='bottom'){
el.style.bottom='8px';
if(s.align==='center'){el.style.left='50%';el.style.transform='translateX(-50%)';}
else if(s.align==='left'){el.style.left='8px';}
else{el.style.right='8px';}
}else if(s.position==='left'){
el.style.left='8px';
if(s.align==='center'){el.style.top='50%';el.style.transform='translateY(-50%)';}
else if(s.align==='left'){el.style.top='8px';}
else{el.style.bottom='8px';}
}else{
el.style.right='8px';
if(s.align==='center'){el.style.top='50%';el.style.transform='translateY(-50%)';}
else if(s.align==='left'){el.style.top='8px';}
else{el.style.bottom='8px';}
}
}
function barIconHtml(icon,h){if(!icon)return'';if(icon.kind==='emoji')return'<span style="font-size:'+h+';line-height:1">'+esc(icon.value)+'</span>';var u=icon.kind==='mfd'?('/icons-mfd-png/'+icon.value+'.png'):icon.value;return'<span class="im" style="width:'+h+';height:'+h+';background-color:currentColor;-webkit-mask-image:url('+u+');mask-image:url('+u+');"></span>';}
function mkBarBtn(label,active,s,icon){
var b=document.createElement('button');var st=active?s.active:s.inactive;var ta=s.textAlign||'left';
b.style.height=s.height+'px';b.style.minWidth=s.width+'px';b.style.borderRadius=s.radius+'px';
b.style.background=st.bg;b.style.borderColor=st.border;
b.style.fontFamily=st.font.family;b.style.fontWeight=st.font.weight;b.style.fontSize=st.font.size;b.style.color=st.font.color;
b.style.justifyContent=(ta==='center'?'center':(ta==='right'?'flex-end':'flex-start'));
var icHtml=icon?barIconHtml(icon,(s.height-14)+'px'):'';
var lblHtml='<span class="btext" style="text-align:'+ta+'">'+esc(label)+'</span>';
if(icon){if(s.iconPos==='right')b.innerHTML=lblHtml+'<span class="bicon">'+icHtml+'</span>';else b.innerHTML='<span class="bicon">'+icHtml+'</span>'+lblHtml;}
else b.innerHTML=lblHtml;
return b;}
function planBg(){return(config&&config.planBg)||'#2a2f36';}
function scaleMode(){return(config&&config.scaleMode)||'height';}
function isOnlyLockChange(oldCfg,newCfg){
if(!oldCfg||!newCfg)return false;
if(oldCfg.scaleMode!==newCfg.scaleMode)return false;
if(oldCfg.planBg!==newCfg.planBg)return false;
if(!oldCfg.floors||!newCfg.floors)return false;
if(oldCfg.floors.length!==newCfg.floors.length)return false;
for(var i=0;i<oldCfg.floors.length;i++){
var of=oldCfg.floors[i],nf=newCfg.floors[i];
if(of.id!==nf.id||of.name!==nf.name||of.image!==nf.image)return false;
if(JSON.stringify(of.icon)!==JSON.stringify(nf.icon))return false;
if(!of.layers||!nf.layers)return false;
if(of.layers.length!==nf.layers.length)return false;
for(var j=0;j<of.layers.length;j++){
var ol=of.layers[j],nl=nf.layers[j];
if(ol.id!==nl.id||ol.name!==nl.name)return false;
if(JSON.stringify(ol.icon)!==JSON.stringify(nl.icon))return false;
if(!ol.devices||!nl.devices)return false;
if(ol.devices.length!==nl.devices.length)return false;
for(var k=0;k<ol.devices.length;k++){
var od=ol.devices[k],nd=nl.devices[k];
if(od.id!==nd.id||od.name!==nd.name||od.x!==nd.x||od.y!==nd.y)return false;
if(od.objType!==nd.objType||od.iconType!==nd.iconType)return false;
if(od.iconOn!==nd.iconOn||od.iconOff!==nd.iconOff||od.iconName!==nd.iconName)return false;
if(od.showValue!==nd.showValue||od.showName!==nd.showName)return false;
if(JSON.stringify(od.icon)!==JSON.stringify(nd.icon))return false;
if(JSON.stringify(od.valueFont)!==JSON.stringify(nd.valueFont))return false;
if(JSON.stringify(od.nameFont)!==JSON.stringify(nd.nameFont))return false;
}
}
}
return true;
}
document.addEventListener('DOMContentLoaded',function(){loadConfig();setInterval(pollStates,2000);setInterval(pollConfig,1000);setInterval(checkLocks,1000);window.addEventListener('resize',applyLayout);});
function planImageMissing(){document.getElementById('planContainer').innerHTML='<div class="loading">План не найден.</div>';}
function loadConfig(){fetch('/api/config?v='+Date.now()).then(function(r){return r.json();}).then(function(d){config=d;lastConfigJson=JSON.stringify(d);renderStructure();}).catch(function(){});}
function pollConfig(){fetch('/api/config?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
var s=JSON.stringify(d);
if(s!==lastConfigJson){
if(isOnlyLockChange(config,d)){
config=d;
lastConfigJson=s;
updatePresentationMarkers();
}else{
config=d;
lastConfigJson=s;
renderStructure();
}
}
}).catch(function(){});}
function collectIds(){var ids=[];if(!config||!config.floors)return ids;config.floors.forEach(function(f){(f.layers||[]).forEach(function(l){(l.devices||[]).forEach(function(d){(d.stateIds||[]).forEach(function(s){if(s&&ids.indexOf(s)<0)ids.push(s);});});});});return ids;}
function pollStates(){
if(!config)return;var changed=false;
collectIds().forEach(function(sid){
fetch('/api/state/'+sid+'?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
if(d&&deviceStates[sid]!==d.val){deviceStates[sid]=d.val;changed=true;}
}).catch(function(){});
});
if(changed)updatePresentationMarkers();
}
function updatePresentationMarkers(){
var f=getFloor();if(!f)return;
var layer=null;
for(var i=0;i<(f.layers||[]).length;i++)if(f.layers[i].id===currentLayerId){layer=f.layers[i];break;}
if(!layer)return;
(layer.devices||[]).forEach(function(dev){
var m=document.querySelector('.marker[data-dev-id="'+dev.id+'"]');if(!m)return;
var stateVal=dev.stateIds&&dev.stateIds[0]?deviceStates[dev.stateIds[0]]:null;
var ic=dev.icon||defaultIcon(dev.objType);var key=getStateKey(dev,stateVal);
var newBg=(ic.bg&&ic.bg[key])||'#fff';
var newBd=(ic.border&&ic.border[key])||defColor(key);
if(m.style.backgroundColor!==newBg)m.style.backgroundColor=newBg;
if(m.style.borderColor!==newBd)m.style.borderColor=newBd;
var newShadow=stateVal?'0 0 15px '+newBd:'none';
if(m.style.boxShadow!==newShadow)m.style.boxShadow=newShadow;
var iconEl=m.querySelector('.mi,.im');
var newIcon=slotHtml((ic.slots||{})[key],(ic.color&&ic.color[key])||defColor(key));
if(iconEl&&iconEl.outerHTML!==newIcon)iconEl.outerHTML=newIcon;
var lockEl=m.querySelector('.lock-icon');var hasLock=!!dev.locked;
if(hasLock&&!lockEl){var lk=document.createElement('div');lk.className='lock-icon';lk.textContent='🔒';m.appendChild(lk);}
else if(!hasLock&&lockEl)lockEl.remove();
if(dev.showValue!==false&&dev.stateIds&&dev.stateIds.length){
var vd=m.querySelector('.lbl');
if(!vd){vd=document.createElement('span');vd.className='lbl lp-'+({bottom:'b',top:'t',right:'r',left:'l',overlay:'o'}[(dev.valueFont&&dev.valueFont.position)||'overlay']);applyFont(vd,dev.valueFont||DEF_VF);m.appendChild(vd);}
var newText='';
dev.stateIds.forEach(function(s,idx){var val=deviceStates[s];var pr=(dev.prefixes&&dev.prefixes[idx]!=null)?dev.prefixes[idx]:'';var po=(dev.postfixes&&dev.postfixes[idx]!=null)?dev.postfixes[idx]:'';newText+=pr+((val!==undefined&&val!==null)?val:'N/A')+po+'\n';});
newText=newText.trim();
if(vd.textContent!==newText){vd.innerHTML='';dev.stateIds.forEach(function(s,idx){var val=deviceStates[s];var pr=(dev.prefixes&&dev.prefixes[idx]!=null)?dev.prefixes[idx]:'';var po=(dev.postfixes&&dev.postfixes[idx]!=null)?dev.postfixes[idx]:'';var ln=document.createElement('span');ln.style.display='block';ln.textContent=pr+((val!==undefined&&val!==null)?val:'N/A')+po;vd.appendChild(ln);});}
}
});
}
function checkLocks(){
var now=Date.now();var changed=false;
if(!config||!config.floors)return;
config.floors.forEach(function(f){(f.layers||[]).forEach(function(l){(l.devices||[]).forEach(function(d){
if(d.lockedUntil&&now>d.lockedUntil){d.locked=true;d.lockedUntil=null;changed=true;}
});});});
if(changed){
lastConfigJson=JSON.stringify(config);
saveConfig();
updatePresentationMarkers();
}
}
function saveConfig(){fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}).catch(function(){});}
function getFloor(){if(!config||!config.floors)return null;for(var i=0;i<config.floors.length;i++)if(config.floors[i].id===currentFloorId)return config.floors[i];return null;}
function renderStructure(){
if(!config||!config.floors||!config.floors.length){document.getElementById('planContainer').innerHTML='<div class="loading">План не настроен.</div>';return;}
if(!currentFloorId)currentFloorId=(requestedFloorId&&config.floors.some(function(f){return f.id===requestedFloorId;}))?requestedFloorId:config.floors[0].id;
renderPlan(getFloor());}
function renderPlan(f){
var c=document.getElementById('planContainer');
if(!f||!f.image){c.innerHTML='<div class="loading">Нет изображения</div>';return;}
c.innerHTML='<div class="plan-inner" id="planInner" style="background:'+planBg()+'"><div class="bar" id="floorBar"></div><div class="bar" id="layerBar"></div><div class="plan-content" id="planContent"><img src="'+f.image+'?v='+Date.now()+'" class="plan-image" onerror="planImageMissing()" onload="applyLayout()"></div></div>';
buildBars(f);renderDevices(f);applyLayout();}
function buildBars(f){
var fb=document.getElementById('floorBar');var lb=document.getElementById('layerBar');
if(requestedFloorId){fb.style.display='none';}
else{var s=config.floorBar||barDefaults();if(!s.textAlign)s.textAlign='left';styleBar(fb,s);fb.innerHTML='';
config.floors.forEach(function(fl){var b=mkBarBtn(fl.name,fl.id===currentFloorId,s,fl.icon);b.onclick=function(){currentFloorId=fl.id;currentLayerId=null;renderStructure();};fb.appendChild(b);});}
var s2=config.layerBar||barDefaults();if(!s2.textAlign)s2.textAlign='left';styleBar(lb,s2);lb.innerHTML='';
if(!currentLayerId||!f.layers.some(function(l){return l.id===currentLayerId;}))currentLayerId=f.layers[0]?f.layers[0].id:null;
f.layers.forEach(function(l){var b=mkBarBtn(l.name,l.id===currentLayerId,s2,l.icon);b.onclick=function(){currentLayerId=l.id;renderStructure();};lb.appendChild(b);});}
function renderDevices(f){
var content=document.getElementById('planContent');if(!content)return;
var layer=null;for(var i=0;i<(f.layers||[]).length;i++)if(f.layers[i].id===currentLayerId){layer=f.layers[i];break;}if(!layer)return;
(layer.devices||[]).forEach(function(dev){
dev.objType=normalizeType(dev.objType);
var ic=dev.icon||defaultIcon(dev.objType);
var v=dev.stateIds&&dev.stateIds[0]?deviceStates[dev.stateIds[0]]:null;
var key=getStateKey(dev,v);
var m=document.createElement('div');m.className='marker';m.dataset.devId=dev.id;
m.style.left=dev.x+'%';m.style.top=dev.y+'%';m.style.width=(ic.size||48)+'px';m.style.height=(ic.size||48)+'px';m.style.opacity=ic.opacity!=null?ic.opacity:1;
m.style.backgroundColor=(ic.bg&&ic.bg[key])||'#fff';m.style.borderColor=(ic.border&&ic.border[key])||defColor(key);
if(v)m.style.boxShadow='0 0 15px '+((ic.border&&ic.border[key])||defColor(key));
m.innerHTML=slotHtml((ic.slots||{})[key],(ic.color&&ic.color[key])||defColor(key));
if(dev.locked){var lock=document.createElement('div');lock.className='lock-icon';lock.textContent='🔒';m.appendChild(lock);}
if(dev.showValue!==false&&dev.stateIds&&dev.stateIds.length){
var vd=document.createElement('span');vd.className='lbl lp-'+({bottom:'b',top:'t',right:'r',left:'l',overlay:'o'}[(dev.valueFont&&dev.valueFont.position)||'overlay']);
applyFont(vd,dev.valueFont||DEF_VF);
dev.stateIds.forEach(function(sid,idx){var val=deviceStates[sid];var pr=(dev.prefixes&&dev.prefixes[idx]!=null)?dev.prefixes[idx]:'';var po=(dev.postfixes&&dev.postfixes[idx]!=null)?dev.postfixes[idx]:'';var ln=document.createElement('span');ln.style.display='block';ln.textContent=pr+((val!==undefined&&val!==null)?val:'N/A')+po;vd.appendChild(ln);});
m.appendChild(vd);}
if(dev.showName!==false){
var nm=document.createElement('span');nm.className='lbl lp-'+({bottom:'b',top:'t',right:'r',left:'l',overlay:'o'}[(dev.nameFont&&dev.nameFont.position)||'bottom']);
nm.textContent=dev.name||'';applyFont(nm,dev.nameFont||DEF_NF);m.appendChild(nm);}
if(dev.objType==='switch'){m.classList.add('clickable');m.onclick=function(){toggleDevice(dev);};}
content.appendChild(m);});}
function toggleDevice(dev){
var sid=dev.stateIds&&dev.stateIds[0];if(!sid)return;
var cur=deviceStates[sid];
if(dev.locked){
dev.locked=false;dev.lockedUntil=Date.now()+10000;
lastConfigJson=JSON.stringify(config);
saveConfig();updatePresentationMarkers();return;
}
if(dev.lockedUntil&&Date.now()<dev.lockedUntil){
set(sid,!cur);dev.locked=true;dev.lockedUntil=null;
lastConfigJson=JSON.stringify(config);
saveConfig();updatePresentationMarkers();return;
}
set(sid,!cur);}
function set(sid,val){fetch('/api/state/'+sid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({val:val})}).then(function(){deviceStates[sid]=val;updatePresentationMarkers();}).catch(function(){alert('Ошибка');});}
function applyLayout(){
var c=document.getElementById('planContainer');
var inner=document.getElementById('planInner');
var content=document.getElementById('planContent');
var img=document.querySelector('.plan-image');
if(!c||!inner||!content||!img||!img.naturalWidth)return;
var mode=scaleMode();
var winW=c.clientWidth;
var winH=c.clientHeight;
var natW=img.naturalWidth;
var natH=img.naturalHeight;
var padPct=0.03;
var targetPct=0.88;
var dispW,dispH;
if(mode==='none'){
dispW=natW;
dispH=natH;
}else if(mode==='width'){
dispW=winW*targetPct;
var scale=dispW/natW;
dispH=natH*scale;
}else if(mode==='height'){
dispH=winH*targetPct;
var scale=dispH/natH;
dispW=natW*scale;
}
var padW=dispW*padPct;
var padH=dispH*padPct;
var innerW=dispW+2*padW;
var innerH=dispH+2*padH;
inner.style.width=innerW+'px';
inner.style.height=innerH+'px';
content.style.width=dispW+'px';
content.style.height=dispH+'px';
content.style.left=padW+'px';
content.style.top=padH+'px';
var leftPos,topPos;
if(innerW<=winW){
leftPos=(winW-innerW)/2;
}else{
leftPos=padW;
}
if(innerH<=winH){
topPos=(winH-innerH)/2;
}else{
topPos=padH;
}
inner.style.left=leftPos+'px';
inner.style.top=topPos+'px';
}
window.planImageMissing=planImageMissing;
window.applyLayout=applyLayout;
</script></body></html>
